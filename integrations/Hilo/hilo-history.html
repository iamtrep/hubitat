<script>
// Follow the hub UI theme, which the hub keeps in this origin's localStorage (absent on firmware without dark mode).
(function(){
    const apply=v=>{document.documentElement.dataset.hubitatTheme=v==='dark'?'dark':'light'};
    try{apply(localStorage.getItem('hubitat-ui-theme'))}catch(e){apply(null)}
    addEventListener('storage',e=>{if(e.key==='hubitat-ui-theme')apply(e.newValue)});
})();
</script>

}; // end I18N

// The language: #lang= in the URL hash, else the one Hilo Manager wrote for the location
// (hilo-<location>-ui.json), else French. Set once, before the first render.
const HASH_LANG = (v => v === 'fr' || v === 'en' ? v : null)(new URLSearchParams(location.hash.slice(1)).get('lang'));
let LANG = HASH_LANG || 'fr';
const locale = () => LANG === 'fr' ? 'fr-CA' : 'en-CA';
const t = (key, args = {}) => {
    let s = (I18N[LANG] || {})[key] ?? I18N.en[key] ?? key;
    for (const [k, v] of Object.entries(args)) s = s.split(`{${k}}`).join(v == null ? '' : String(v));
    return s;
};
function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t('page.title');
    $('pageTitle').textContent = t('page.title');
    $('loc').setAttribute('aria-label', t('aria.loc'));
    $('month').setAttribute('aria-label', t('aria.period'));
    if (!$('range').textContent) $('range').textContent = t('page.loading');
    if ($('status')) $('status').textContent = t('st.readingFM');
}

// Reads the Hilo Manager's month files (hilo-<location>-energy-YYYY-MM.json) from this hub's
// File Manager. Hours are keyed by their local start time, so 23- and 25-hour days need no case.
const FILE_RE = /^hilo-(.+)-energy-(\d{4}-\d{2})\.json$/;
// Hydro-Québec's winter peak-event windows, local time, shaded on days from December 1 to March 31.
// Morning events ran 06:00–09:00 in winter 2024–25 and 06:00–10:00 from 2025–26 (Hydro-Québec open data).
// A date outside winter takes the window of the winter that follows it.
const peaksFor = date => { const y = +date.slice(0, 4), w = +date.slice(5, 7) >= 7 ? y : y - 1; return w >= 2025 ? [[6, 10], [16, 20]] : [[6, 9], [16, 20]]; };
const windowsText = P => P.map(([a, b]) => `${String(a).padStart(2, '0')}:00–${String(b).padStart(2, '0')}:00`).join(t('w.and'));
const inSeason = date => ['12', '01', '02', '03'].includes(date.slice(5, 7));
// Actual peak events: Hydro-Québec open data, the residential winter-credit offer (CPC-D), the same
// feed as the Hydro Peak Events app. The API allows cross-origin reads; times come back in UTC.
const EVENTS_URL = 'https://donnees.hydroquebec.com/api/explore/v2.1/catalog/datasets/evenements-pointe/records';
const EVENT_OFFER = 'CPC-D';
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => v == null ? '–' : v.toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthName = m => new Date(m + '-15T12:00:00').toLocaleDateString(locale(), { month: 'short', year: 'numeric' });
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const hourOf = start => +start.slice(11, 13);
const inPeak = (h, date) => peaksFor(date).some(([a, b]) => h >= a && h < b);
// Outdoor temperature comes from Open-Meteo's historical API at the hub's coordinates. Asked in UTC
// epoch seconds: its local-time output has 24 hours on clock-change days.
const TEMP_URL = 'https://archive-api.open-meteo.com/v1/archive';

let files = {};   // location -> [{month, name, date}]
let days = [];    // [{date, hours:[{h, kWh}], total, nulls, n}] for the chosen location, sorted
let selDay = null;
let view = null;       // {from, to} dates while zoomed into a range dragged on the daily chart, else null
const zoomStack = [];  // earlier periods, for zoom out: {month, view}
let temps = null; // {byHour: Map(epoch s -> degrees), unit, note}; null until loaded or when unavailable
let tempNote = '';
let events = null; // [{s, e, slot}] epoch seconds; null until loaded or when unavailable
let eventNote = '';

async function getJson(url, cache = 'no-store') {
    const r = await fetch(url, { cache });
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    return r.json();
}

async function init() {
    applyStatic();
    let list;
    try {
        list = await getJson('/hub/fileManager/json');
    } catch (e) {
        return fail(t('err.list', { why: e.message }));
    }
    for (const f of list.files || []) {
        const m = FILE_RE.exec(f.name);
        if (m) (files[m[1]] = files[m[1]] || []).push({ month: m[2], name: f.name, date: f.date });
    }
    const locs = Object.keys(files).sort();
    if (!locs.length) return fail(t('err.noFiles'));
    const want = new URLSearchParams(location.hash.slice(1));
    const first = locs.includes(want.get('loc')) ? want.get('loc') : locs[0];
    if (!HASH_LANG) {
        const ui = (list.files || []).find(f => f.name === `hilo-${first}-ui.json`);
        const doc = ui ? await getJson(monthUrl(ui), 'force-cache').catch(() => null) : null;
        if (doc && (doc.lang === 'fr' || doc.lang === 'en')) LANG = doc.lang;
        applyStatic();
    }
    const loc = $('loc');
    loc.innerHTML = locs.map(l => `<option value="${esc(l)}">${esc(t('loc.option', { id: l }))}</option>`).join('');
    loc.hidden = locs.length < 2;
    loc.onchange = () => loadLocation(loc.value);
    loc.value = first;
    $('month').onchange = () => {
        if ($('month').value === 'range') return;
        view = null; zoomStack.length = 0; syncRange(); selDay = null; render();
    };
    addEventListener('keydown', e => { if (e.key === 'Escape' && zoomStack.length) zoomOut(); });
    // The page's own hash updates use replaceState, which fires no hashchange; this is a link or a typed address.
    addEventListener('hashchange', () => location.reload());
    await loadLocation(loc.value, want);
}

// The hub sends no cache headers; File Manager's modification time in the URL lets the browser
// keep each month file until it changes.
const monthUrl = f => `/local/${encodeURIComponent(f.name)}?v=${encodeURIComponent(f.date || Date.now())}`;

async function loadLocation(loc, want) {
    $('status') && ($('status').textContent = t('st.reading'));
    const list = files[loc].sort((a, b) => a.month.localeCompare(b.month));
    const docs = await Promise.all(list.map(f => getJson(monthUrl(f), 'force-cache').catch(() => null)));
    const all = {};
    docs.forEach(d => Object.assign(all, (d && d.days) || {}));
    days = Object.keys(all).sort().map(date => {
        const hours = (all[date] || []).map(x => ({ h: hourOf(x.start), at: Date.parse(x.start) / 1000, kWh: x.kWh == null ? null : +x.kWh }));
        const known = hours.filter(x => x.kWh != null);
        return { date, hours, n: hours.length, nulls: hours.length - known.length, total: known.reduce((s, x) => s + x.kWh, 0) };
    });
    if (!days.length) return fail(t('err.noDays'));
    const months = [...new Set(days.map(d => d.date.slice(0, 7)))];
    const sel = $('month');
    sel.innerHTML = `<option value="">${esc(t('opt.all', { n: months.length }))}</option>` +
        months.slice().reverse().map(m => `<option value="${m}">${monthName(m)}</option>`).join('');
    $('range').textContent = t('range.onFile', { from: dayName(days[0].date), to: dayName(days[days.length - 1].date), n: days.length });
    // The URL hash keeps the day and period: #day=YYYY-MM-DD and from=…&to=… (a zoomed range) or m=YYYY-MM|all.
    // Without a period, the day opens on its month.
    const has = k => want && days.some(d => d.date === want.get(k));
    selDay = has('day') ? want.get('day') : null;
    view = null; zoomStack.length = 0;
    const m = want && want.get('m');
    if (m === 'all') sel.value = '';
    else if (m && months.includes(m)) sel.value = m;
    else if (selDay) sel.value = selDay.slice(0, 7);
    if (has('from') && has('to') && want.get('from') <= want.get('to')) {
        // Zoom out from a restored range goes to the months it spans: one month, else all.
        const from = want.get('from'), to = want.get('to');
        zoomStack.push({ month: from.slice(0, 7) === to.slice(0, 7) ? from.slice(0, 7) : '', view: null });
        view = { from, to };
    }
    syncRange();
    temps = null;
    tempNote = t('temp.loading');
    render();
    loadTemps(days[0].date, days[days.length - 1].date).then(render, e => { tempNote = t('temp.unavailable', { why: e.message }); render(); });
    events = null;
    eventNote = t('ev.loading');
    loadEvents().then(render, e => { eventNote = t('ev.unavailable', { why: e.message }); render(); });
}

// All CPC-D events, a page of 100 at a time; marks each hour inside one (x.ev) and each day's slots (d.ev).
async function loadEvents() {
    const out = [];
    for (let offset = 0; offset < 1000; offset += 100) {
        const q = new URLSearchParams({ order_by: 'datedebut', limit: 100, offset, refine: `offre:"${EVENT_OFFER}"` });
        const r = await fetch(`${EVENTS_URL}?${q}`);
        if (!r.ok) throw new Error(`Hydro-Québec HTTP ${r.status}`);
        const page = (await r.json()).results || [];
        page.forEach(x => {
            const s = Date.parse(x.datedebut) / 1000, e = Date.parse(x.datefin) / 1000;
            if (s && e) out.push({ s, e, slot: x.plagehoraire || '' });
        });
        if (page.length < 100) break;
    }
    events = out;
    days.forEach(d => {
        d.hours.forEach(x => x.ev = out.some(v => x.at >= v.s && x.at < v.e));
        d.ev = [...new Set(out.filter(v => d.hours.some(x => x.at >= v.s && x.at < v.e)).map(v => v.slot))].sort();
    });
    const inRange = out.filter(v => days.length && v.e > days[0].hours[0]?.at);
    eventNote = t('ev.note', { offer: EVENT_OFFER, n: out.length, k: inRange.length, span: out.length ? t('ev.span', {
        from: dayName(new Date(out[0].s * 1000).toISOString().slice(0, 10)), to: dayName(new Date(out[out.length - 1].s * 1000).toISOString().slice(0, 10)) }) : '' });
}

const evDay = d => events && d.ev && d.ev.length > 0;
const evLabel = d => evDay(d) ? t('ev.label', { slots: d.ev.join(' + ') }) : '';

// Index runs [a, b) where flags are true.
function runs(flags) {
    const out = [];
    flags.forEach((f, i) => { if (f && (i === 0 || !flags[i - 1])) out.push([i, i + 1]); else if (f) out[out.length - 1][1] = i + 1; });
    return out;
}

async function loadTemps(from, to) {
    const hub = await getJson('/hub/details/json');
    if (hub.latitude == null || hub.longitude == null) throw new Error(t('temp.noLoc'));
    const unit = hub.tempScale === 'F' ? 'F' : 'C';
    // Dates are UTC: a local evening falls on the next UTC day, so ask one day past the last.
    const next = new Date(Date.parse(to + 'T00:00:00Z') + 86400000).toISOString().slice(0, 10);
    const q = new URLSearchParams({ latitude: hub.latitude, longitude: hub.longitude, start_date: from, end_date: next,
        hourly: 'temperature_2m', timezone: 'GMT', timeformat: 'unixtime', temperature_unit: unit === 'F' ? 'fahrenheit' : 'celsius' });
    const r = await fetch(`${TEMP_URL}?${q}`);
    if (!r.ok) throw new Error(`Open-Meteo HTTP ${r.status}`);
    const h = (await r.json()).hourly || {};
    const byHour = new Map();
    (h.time || []).forEach((t, i) => { if (h.temperature_2m[i] != null) byHour.set(t, h.temperature_2m[i]); });
    temps = { byHour, unit };
    days.forEach(d => {
        d.hours.forEach(x => x.t = byHour.has(x.at) ? byHour.get(x.at) : null);
        const known = d.hours.filter(x => x.t != null).map(x => x.t);
        d.tMean = known.length ? known.reduce((s, v) => s + v, 0) / known.length : null;
        d.tMin = known.length ? Math.min(...known) : null;
        d.tMax = known.length ? Math.max(...known) : null;
    });
    tempNote = t('temp.note', { lat: fmt(+hub.latitude, 2), lon: fmt(+hub.longitude, 2) });
}

const deg = (v, d = 1) => v == null ? '–' : fmt(v, d) + ' °' + temps.unit;

function fail(msg) {
    $('main').innerHTML = `<div class="card msg muted">${esc(msg)}</div>`;
    $('range').textContent = '';
}

const full = d => d.nulls === 0 && d.n > 0;
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;

// The period shown: a dragged range, else the month picked, else every day.
function periodSet() {
    if (view) return days.filter(d => d.date >= view.from && d.date <= view.to);
    const m = $('month').value;
    return m ? days.filter(d => d.date.startsWith(m)) : days;
}
const shortDay = d => new Date(d + 'T12:00:00').toLocaleDateString(locale(), { day: 'numeric', month: 'short', year: 'numeric' });
const rangeName = () => view ? t('range.to', { from: shortDay(view.from), to: shortDay(view.to) }) : '';

// While zoomed, the period list shows the range as its own entry.
function syncRange() {
    const sel = $('month');
    let o = sel.querySelector('option[value="range"]');
    if (view) {
        if (!o) { o = document.createElement('option'); o.value = 'range'; sel.insertBefore(o, sel.firstChild); }
        o.textContent = rangeName();
        sel.value = 'range';
    } else if (o) o.remove();
}

function pushPeriod() { zoomStack.push({ month: $('month').value, view }); }
function zoomTo(from, to) { pushPeriod(); view = { from, to }; syncRange(); selDay = null; render(); }
function goMonth(m) { pushPeriod(); view = null; syncRange(); $('month').value = m; selDay = null; render(); }
function zoomOut() {
    const prev = zoomStack.pop();
    if (!prev) return;
    view = prev.view;
    syncRange();
    if (!view) $('month').value = prev.month;
    selDay = null;
    render();
}

function render() {
    const m = view ? '' : $('month').value;
    const set = periodSet();
    const label = view ? rangeName() : (m ? monthName(m) : '');
    const fulls = set.filter(full);
    const total = set.reduce((s, d) => s + d.total, 0);
    const maxDay = fulls.reduce((a, d) => !a || d.total > a.total ? d : a, null);
    let maxHour = null;
    set.forEach(d => d.hours.forEach(x => { if (x.kWh != null && (!maxHour || x.kWh > maxHour.kWh)) maxHour = { ...x, date: d.date }; }));
    const avg = fulls.length ? fulls.reduce((s, d) => s + d.total, 0) / fulls.length : null;
    if (!selDay || !set.some(d => d.date === selDay)) selDay = (maxDay || set[set.length - 1]).date;
    const dayRows = !!m || (view && set.length <= 62);

    $('main').innerHTML = `
    <div class="tiles">
        ${tile(fmt(total, 0) + ' kWh', view ? t('tile.usedRange', { label }) : m ? t('tile.usedIn', { label }) : t('tile.usedAll'))}
        ${tile(avg == null ? '–' : fmt(avg) + ' kWh', t('tile.avg', { n: fulls.length }))}
        ${tile(maxDay ? fmt(maxDay.total) + ' kWh' : '–', maxDay ? t('tile.maxDayOn', { day: dayName(maxDay.date) }) : t('tile.maxDay'))}
        ${tile(maxHour ? fmt(maxHour.kWh, 2) + ' kWh' : '–', maxHour ? t('tile.maxHourAt', { day: dayName(maxHour.date), h: maxHour.h }) : t('tile.maxHour'))}
    </div>
    <div class="card"><h2><span>${t('daily.title')}${label ? ', ' + esc(label) : ''} ${zoomStack.length ? `<button id="zoomOut" title="${esc(t('btn.zoomOutTip'))}">${t('btn.zoomOut')}</button>` : ''}</span><span class="legend">${t('daily.legend')}${temps ? ' ' + t('daily.legendTemp') : ''}${events ? ' ' + t('daily.legendEv') : ''}</span></h2><div id="daily"></div>
        <div class="legend" style="margin-top:6px">${esc(tempNote)}</div><div class="legend">${esc(eventNote)}</div></div>
    <div class="card"><h2><span id="dayTitle"></span><span class="legend" id="dayNote"></span></h2><div id="hourly"></div>
        <div class="legend" style="margin-top:6px">${t('hourly.legend', { windows: windowsText(peaksFor(selDay || set[set.length - 1].date)) })}${events ? ' · ' + t('hourly.legendEv') : ''}</div></div>
    ${temps ? `<div class="card"><h2><span>${t('scatter.title')}</span><span class="legend">${t('scatter.legend')}${events ? ' ' + t('scatter.legendEv') : ''}</span></h2><div id="scatter"></div></div>` : ''}
    <div class="card"><h2><span>${t('profile.title')}${label ? ', ' + esc(label) : ''}</span><span class="legend">${t('profile.legend', { windows: windowsText(peaksFor(set[set.length - 1].date)) })}</span></h2><div id="profile"></div><div class="legend" id="profileNote" style="margin-top:6px"></div><div class="legend" id="peakShare"></div></div>
    <div class="card"><h2><span>${t(dayRows ? 'table.days' : 'table.months')}</span></h2><div class="scroll" id="table"></div></div>`;
    if ($('zoomOut')) $('zoomOut').onclick = zoomOut;
    drawDaily(set);
    drawDay();
    drawProfile(fulls);
    if (temps) drawScatter(set, fulls);
    drawTable(dayRows, set);
}

const tile = (v, l) => `<div class="card tile"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;

// Bar chart helper: values [{label, value, cls, key}], returns SVG markup.
// line: optional values (same length, null for gaps) drawn on their own scale, labelled on the right.
// shade: [{a, b, cls}] bar-index ranges drawn behind the bars. v.mark: a mark above the plot for that bar.
// overlay: optional values on the bars' own scale, drawn as a line with points.
function bars(vals, { height = 220, labelEvery = 1, shade = [], fmtTip, unitDigits = 1, line = null, overlay = null } = {}) {
    if (line && !line.some(v => v != null)) line = null;
    if (overlay && !overlay.some(v => v != null)) overlay = null;
    const W = 1000, H = height, L = 44, R = line ? 40 : 8, T = 12, B = 26;
    const max = Math.max(...vals.map(v => v.value || 0), ...(overlay || []).map(v => v || 0), 0.001);
    const step = niceStep(max);
    const top = Math.ceil(max / step) * step;
    const bw = (W - L - R) / vals.length;
    const y = v => T + (H - T - B) * (1 - v / top);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    shade.forEach(({ a, b, cls }) => s += `<rect class="${cls}" x="${L + a * bw}" y="${T}" width="${(b - a) * bw}" height="${H - T - B}"/>`);
    vals.forEach((v, i) => { if (v.mark) s += `<rect class="evrug" x="${L + i * bw}" y="${T - 8}" width="${Math.max(bw, 1.5)}" height="5"/>`; });
    for (let g = 0; g <= top + 1e-9; g += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmt(g, Number.isInteger(step) ? 0 : 1)}</text>`;
    vals.forEach((v, i) => {
        const x = L + i * bw, h = v.value == null ? 0 : (H - T - B) * (v.value / top);
        if (v.value != null) s += `<rect class="bar ${v.cls || ''}" x="${x + bw * 0.12}" y="${y(v.value)}" width="${Math.max(bw * 0.76, 1)}" height="${h}" rx="${Math.min(2, bw / 6)}"/>`;
        s += `<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H - T - B}" data-k="${esc(v.key ?? '')}" data-tip="${esc(fmtTip ? fmtTip(v) : v.label + ': ' + fmt(v.value, unitDigits))}"/>`;
        if (i % labelEvery === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(v.label)}</text>`;
    });
    if (line) {
        const known = line.filter(v => v != null), ts = niceStep(Math.max(Math.max(...known) - Math.min(...known), 1));
        const lo = Math.floor(Math.min(...known) / ts) * ts, hi = Math.max(Math.ceil(Math.max(...known) / ts) * ts, lo + ts);
        const ly = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
        for (let g = lo; g <= hi + 1e-9; g += ts) s += `<text class="taxis" x="${W - R + 6}" y="${ly(g) + 4}">${fmt(g, Number.isInteger(ts) ? 0 : 1)}°</text>`;
        let d = '';
        line.forEach((v, i) => { if (v != null) d += `${i && line[i - 1] != null ? 'L' : 'M'}${L + (i + 0.5) * bw},${ly(v)}`; });
        s += `<path class="tline" d="${d}"/>`;
    }
    if (overlay) {
        let d = '';
        overlay.forEach((v, i) => { if (v != null) { d += `${i && overlay[i - 1] != null ? 'L' : 'M'}${L + (i + 0.5) * bw},${y(v)}`; s += `<circle class="ovdot" cx="${L + (i + 0.5) * bw}" cy="${y(v)}" r="3"/>`; } });
        s += `<path class="ovline" d="${d}"/>`;
    }
    return s + '</svg>';
}

function niceStep(max) {
    const raw = max / 5, p = Math.pow(10, Math.floor(Math.log10(raw)));
    return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= raw);
}

function wire(el, onClick) {
    el.querySelectorAll('.hit').forEach(r => {
        r.addEventListener('mousemove', e => { const t = $('tip'); t.textContent = r.dataset.tip; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8) + 'px'; t.style.top = (e.clientY - 34) + 'px'; });
        r.addEventListener('mouseleave', () => $('tip').style.display = 'none');
        if (onClick) r.addEventListener('click', () => onClick(r.dataset.k));
    });
}

function drawDaily(set) {
    const el = $('daily');
    const multiMonth = set.length && set[0].date.slice(0, 7) !== set[set.length - 1].date.slice(0, 7);
    const vals = set.map(d => ({ key: d.date, value: d.total, label: multiMonth || set.length > 40 ? d.date.slice(5) : String(+d.date.slice(8)),
        cls: d.date === selDay ? 'sel' : (full(d) ? '' : 'partial'), mark: evDay(d) }));
    const every = Math.max(1, Math.ceil(set.length / 16));
    el.innerHTML = bars(vals, { labelEvery: every, line: temps && set.map(d => d.tMean), fmtTip: v => {
        const d = set.find(x => x.date === v.key);
        return t('tip.kv', { k: dayName(v.key), v: `${fmt(v.value)} kWh` }) + (d.nulls ? ' ' + t('tip.missing', { n: d.nulls, total: d.n }) : '') + (evDay(d) ? ` · ${evLabel(d)}` : '') +
            (temps && d.tMean != null ? ' · ' + t('tip.temp', { mean: deg(d.tMean), min: deg(d.tMin), max: deg(d.tMax) }) : '');
    } });
    wire(el);
    brush(el, set);
}

function selectDay(k, set) { selDay = k; drawDaily(set); drawDay(); if (temps) drawScatter(set, set.filter(full)); }

// Press and drag across the daily bars to zoom into those days; a press without a drag picks the day.
function brush(el, set) {
    const svg = el.querySelector('svg');
    if (!svg) return;
    const hits = [...svg.querySelectorAll('.hit')];
    if (!hits.length) return;
    let start = null, box = null;
    const idxAt = x => { let k = 0; hits.forEach((h, i) => { if (x >= h.getBoundingClientRect().left) k = i; }); return k; };
    const clear = () => { start = null; if (box) { box.remove(); box = null; } };
    const draw = (a, b) => {
        const i = Math.min(a, b), j = Math.max(a, b);
        const x0 = +hits[i].getAttribute('x'), x1 = +hits[j].getAttribute('x') + +hits[j].getAttribute('width');
        if (!box) {
            box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            box.setAttribute('class', 'brush');
            box.setAttribute('y', hits[0].getAttribute('y'));
            box.setAttribute('height', hits[0].getAttribute('height'));
            svg.appendChild(box);
        }
        box.setAttribute('x', x0);
        box.setAttribute('width', x1 - x0);
    };
    svg.addEventListener('pointerdown', e => { if (e.button) return; start = idxAt(e.clientX); svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove', e => {
        if (start == null) return;
        const k = idxAt(e.clientX);
        if (k !== start) { $('tip').style.display = 'none'; draw(start, k); }
    });
    svg.addEventListener('pointerup', e => {
        if (start == null) return;
        const a = start, k = idxAt(e.clientX);
        clear();
        if (k === a) selectDay(hits[a].dataset.k, set);
        else zoomTo(hits[Math.min(a, k)].dataset.k, hits[Math.max(a, k)].dataset.k);
    });
    svg.addEventListener('pointercancel', clear);
}

function drawDay() {
    const d = days.find(x => x.date === selDay);
    if (!d) return;
    // December to March, and event days, link to the winter credit page on the same window.
    const loc = $('loc').value;
    const period = view ? `from=${view.from}&to=${view.to}` : `m=${$('month').value || 'all'}`;
    history.replaceState(null, '', `#day=${d.date}&${period}&loc=${encodeURIComponent(loc)}${HASH_LANG ? '&lang=' + HASH_LANG : ''}`);
    const evStart = events ? d.hours.find(x => x.ev) : null;
    const wcLink = inSeason(d.date) || evDay(d) ? ` <a class="wclink" href="hilo-winter-credit.html#day=${d.date}&start=${evStart && evStart.h >= 12 ? 16 : 6}&loc=${encodeURIComponent(loc)}&lang=${LANG}">${t('link.wc')}</a>` : '';
    $('dayTitle').innerHTML = esc(t('day.title', { day: dayName(d.date), kwh: fmt(d.total) })) + wcLink;
    const peak = d.hours.filter(x => inPeak(x.h, d.date) && x.kWh != null).reduce((s, x) => s + x.kWh, 0);
    const evRuns = events ? runs(d.hours.map(x => !!x.ev)) : [];
    const evText = evRuns.map(([a, b]) => `${d.hours[a].h}:00–${d.hours[b - 1].h + 1}:00`).join(', ');
    $('dayNote').textContent = (evRuns.length ? `${evLabel(d)} ${evText} · ` : '') +
        (d.n !== 24 ? t('day.clock', { n: d.n }) + ' · ' : '') + (d.nulls ? t('day.missing', { n: d.nulls }) + ' · ' : '') +
        (d.total ? t('day.inPeak', { pct: fmt(100 * peak / d.total, 0) }) : '') +
        (temps && d.tMean != null ? ' · ' + t('day.outdoors', { min: deg(d.tMin), max: deg(d.tMax) }) : '');
    const el = $('hourly');
    // Peak windows on every winter day; an actual event's hours in their own colour, replacing the window they overlap.
    const shade = (d.n === 24 && inSeason(d.date) ? peaksFor(d.date) : [])
        .filter(([a, b]) => !evRuns.some(([ea, eb]) => ea < b && eb > a)).map(([a, b]) => ({ a, b, cls: 'peak' }))
        .concat(evRuns.map(([a, b]) => ({ a, b, cls: 'event' })));
    el.innerHTML = bars(d.hours.map((x, i) => ({ key: i, value: x.kWh, label: String(x.h) })), { height: 180, shade, unitDigits: 2,
        line: temps && d.hours.map(x => x.t),
        fmtTip: v => t('tip.kv', { k: t('tip.hour', { a: d.hours[v.key].h, b: d.hours[v.key].h + 1 }), v: v.value == null ? t('tip.noValue') : fmt(v.value, 2) + ' kWh' }) +
            (temps && d.hours[v.key].t != null ? ` · ${deg(d.hours[v.key].t)}` : '') + (d.hours[v.key].ev ? ' · ' + t('tip.peakEvent') : '') });
    wire(el);
}

// Bars: days without a peak event; line: event days, when the period has any.
function drawProfile(fulls) {
    const el = $('profile');
    const profile = ds => {
        const sums = Array(24).fill(0), counts = Array(24).fill(0);
        ds.forEach(d => d.hours.forEach(x => { if (x.kWh != null) { sums[x.h] += x.kWh; counts[x.h]++; } }));
        return sums.map((s, h) => counts[h] ? s / counts[h] : null);
    };
    const evs = fulls.filter(evDay), ords = evs.length ? fulls.filter(d => !evDay(d)) : fulls;
    const avg = profile(ords), evAvg = evs.length ? profile(evs) : null;
    // The windows of the period's last day; a period across two winters takes the later one.
    const P = fulls.length ? peaksFor(fulls[fulls.length - 1].date) : peaksFor(new Date().toISOString().slice(0, 10));
    el.innerHTML = bars(avg.map((v, h) => ({ key: h, value: v, label: String(h) })), { height: 180, unitDigits: 2, overlay: evAvg,
        shade: P.map(([a, b]) => ({ a, b, cls: 'peak' })),
        fmtTip: v => t('tip.kv', { k: t('tip.hour', { a: v.key, b: v.key + 1 }), v: t('tip.avg', { v: fmt(v.value, 2) }) }) + (evAvg ? ', ' + t('tip.avgEv', { v: fmt(evAvg[v.key], 2) }) : '') });
    wire(el);
    $('profileNote').innerHTML = evAvg ? t('profile.note', { n: ords.length, k: evs.length }) : '';
    const shares = a => {
        const tot = a.reduce((s, v) => s + (v || 0), 0);
        return tot ? P.map(([x, y]) => `${String(x).padStart(2, '0')}:00–${String(y).padStart(2, '0')}:00 ${fmt(a.slice(x, y).reduce((s, v) => s + (v || 0), 0) / tot * 100, 0)} %`).join(', ') : '';
    };
    const base = shares(avg);
    $('peakShare').textContent = base ? t('share.line', { head: t(evAvg ? 'share.headNoEv' : 'share.head'), base,
        hours: P.map(([a, b]) => fmt(100 * (b - a) / 24, 0) + ' %').join(t('w.and')) }) + (evAvg ? '; ' + t('share.ev', { v: shares(evAvg) }) + '.' : '.') : '';
}

// Each full day as a point: mean outdoor temperature across, kWh up.
function drawScatter(set, fulls) {
    const el = $('scatter');
    const pts = fulls.filter(d => d.tMean != null);
    if (!pts.length) { el.innerHTML = `<div class="legend">${t('scatter.none')}</div>`; return; }
    const W = 1000, H = 260, L = 44, R = 12, T = 10, B = 30;
    const xs = pts.map(d => d.tMean), ymax = Math.max(...pts.map(d => d.total), 0.001);
    const xstep = niceStep(Math.max(Math.max(...xs) - Math.min(...xs), 1)), ystep = niceStep(ymax);
    const x0 = Math.floor(Math.min(...xs) / xstep) * xstep, x1 = Math.max(Math.ceil(Math.max(...xs) / xstep) * xstep, x0 + xstep);
    const ytop = Math.ceil(ymax / ystep) * ystep;
    const px = v => L + (W - L - R) * (v - x0) / (x1 - x0), py = v => T + (H - T - B) * (1 - v / ytop);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    for (let g = 0; g <= ytop + 1e-9; g += ystep) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${py(g)}" y2="${py(g)}"/><text x="${L - 6}" y="${py(g) + 4}" text-anchor="end">${fmt(g, Number.isInteger(ystep) ? 0 : 1)}</text>`;
    for (let g = x0; g <= x1 + 1e-9; g += xstep) s += `<line class="grid" x1="${px(g)}" x2="${px(g)}" y1="${T}" y2="${H - B}"/><text x="${px(g)}" y="${H - 12}" text-anchor="middle">${fmt(g, Number.isInteger(xstep) ? 0 : 1)}°</text>`;
    pts.forEach(d => s += `<circle class="dot ${d.date === selDay ? 'sel' : (evDay(d) ? 'ev' : '')}" cx="${px(d.tMean)}" cy="${py(d.total)}" r="${d.date === selDay ? 5 : 3.5}"/>`);
    pts.forEach(d => s += `<circle class="hit" cx="${px(d.tMean)}" cy="${py(d.total)}" r="8" data-k="${d.date}" data-tip="${esc(t('tip.kv', { k: dayName(d.date), v: t('tip.scatter', { kwh: fmt(d.total), t: deg(d.tMean) }) }) + (evDay(d) ? ` · ${evLabel(d)}` : ''))}"/>`);
    el.innerHTML = s + `<text x="${W - R}" y="${H - 1}" text-anchor="end">${esc(t('scatter.axis', { unit: temps.unit }))}</text></svg>`;
    wire(el, k => { selDay = k; drawDaily(set); drawDay(); drawScatter(set, fulls); });
}

function drawTable(dayRows, set) {
    const el = $('table');
    const peakOf = d => d.hours.filter(x => inPeak(x.h, d.date) && x.kWh != null).reduce((s, x) => s + x.kWh, 0);
    if (dayRows) {
        el.innerHTML = `<table><tr><th>${t('th.day')}</th><th>kWh</th><th>${t('th.peak')}</th><th>${t('th.low')}</th><th>${t('th.high')}</th>${temps ? `<th>${t('th.outMean')}</th><th>${t('th.minMax')}</th>` : ''}${events ? `<th>${t('th.event')}</th>` : ''}</tr>` +
            set.slice().reverse().map(d => {
                const known = d.hours.filter(x => x.kWh != null).map(x => x.kWh);
                return `<tr class="click" data-d="${d.date}"><td>${dayName(d.date)}</td><td>${fmt(d.total)}${d.nulls ? ' *' : ''}</td>` +
                    `<td>${d.total ? fmt(100 * peakOf(d) / d.total, 0) + ' %' : '–'}</td><td>${known.length ? fmt(Math.min(...known), 2) : '–'}</td><td>${known.length ? fmt(Math.max(...known), 2) : '–'}</td>` +
                    (temps ? `<td>${deg(d.tMean)}</td><td>${t('range.minMax', { min: deg(d.tMin, 0), max: deg(d.tMax, 0) })}</td>` : '') + (events ? `<td>${evDay(d) ? esc(d.ev.join(' + ')) : ''}</td>` : '') + '</tr>';
            }).join('') + '</table>' + (set.some(d => d.nulls) ? `<div class="legend" style="margin-top:6px">${t('table.missing')}</div>` : '');
        el.querySelectorAll('tr.click').forEach(r => r.onclick = () => { selDay = r.dataset.d; drawDaily(set); drawDay(); if (temps) drawScatter(set, set.filter(full)); $('dayTitle').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
        return;
    }
    const by = {};
    set.forEach(d => (by[d.date.slice(0, 7)] = by[d.date.slice(0, 7)] || []).push(d));
    el.innerHTML = `<table><tr><th>${t('th.month')}</th><th>${t('th.days')}</th><th>kWh</th><th>${t('th.kwhDay')}</th><th>${t('th.maxDay')}</th><th>${t('th.peak')}</th>${temps ? `<th>${t('th.outMean')}</th>` : ''}${events ? `<th>${t('th.evDays')}</th>` : ''}</tr>` +
        Object.keys(by).sort().reverse().map(k => {
            const ds = by[k], f = ds.filter(full), tot = ds.reduce((s, d) => s + d.total, 0);
            const mx = f.reduce((a, d) => !a || d.total > a.total ? d : a, null), p = ds.reduce((s, d) => s + peakOf(d), 0);
            return `<tr class="click" data-m="${k}"><td>${monthName(k)}</td><td>${ds.length}</td><td>${fmt(tot, 0)}</td><td>${f.length ? fmt(f.reduce((s, d) => s + d.total, 0) / f.length) : '–'}</td>` +
                `<td>${mx ? fmt(mx.total) + ' (' + +mx.date.slice(8) + ')' : '–'}</td><td>${tot ? fmt(100 * p / tot, 0) + ' %' : '–'}</td>` +
                (temps ? `<td>${deg(mean(ds.map(d => d.tMean).filter(v => v != null)))}</td>` : '') + (events ? `<td>${ds.filter(evDay).length || ''}</td>` : '') + '</tr>';
        }).join('') + '</table>';
    el.querySelectorAll('tr.click').forEach(r => r.onclick = () => { goMonth(r.dataset.m); scrollTo({ top: 0, behavior: 'smooth' }); });
}

init().catch(e => fail(t('err.read', { why: e.message })));
</script>
</body>
