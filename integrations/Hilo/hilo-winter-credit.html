<script>
// Follow the hub UI theme, which the hub keeps in this origin's localStorage (absent on firmware without dark mode).
(function(){
    const apply=v=>{document.documentElement.dataset.hubitatTheme=v==='dark'?'dark':'light'};
    try{apply(localStorage.getItem('hubitat-ui-theme'))}catch(e){apply(null)}
    addEventListener('storage',e=>{if(e.key==='hubitat-ui-theme')apply(e.newValue)});
})();
</script>

    header h1 { font-size: 1.2rem; font-weight: 600; }

    .muted { color: var(--text-muted); font-size: 0.85rem; }

    .tile .l { font-size: 0.8rem; color: var(--text-muted); }
    svg { display: block; width: 100%; height: auto; }
    svg text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
    .bar { fill: var(--primary); }
    .bar.sel { fill: var(--text); }
    .bar.capped { fill: var(--peak-text); }
    .hit { fill: transparent; cursor: pointer; }
    .grid { stroke: var(--grid); }
    .peak { fill: var(--peak); }
    .event { fill: var(--event); }
    .anchor { fill: var(--anchor); }
    .hline { stroke: var(--text-muted); stroke-width: 1.5; stroke-dasharray: 6 4; pointer-events: none; }

    button { font: inherit; font-size: 0.8rem; padding: 1px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--primary); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.on { border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .bar-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; font-weight: 400; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    /* Headers wrap so a long one doesn't widen the table; values stay on one line. */
    th { color: var(--text-muted); font-weight: 500; white-space: normal; vertical-align: bottom; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--peak); }
    tr.selrow td { background: var(--peak); }
    .scroll { overflow-x: auto; }
    #tip { position: fixed; pointer-events: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    .calc { font-size: 0.88rem; display: grid; gap: 2px; margin: 10px 0; font-variant-numeric: tabular-nums; }
    .calc b { font-weight: 600; }
    td.drop { color: var(--text-muted); text-decoration: line-through; }
    tr.anc td { background: var(--anchor); }
    tr.sum td { font-weight: 600; }
    .wcnote { margin-top: 6px; }
    .bar.over { fill: var(--anchor-text); }
    .cutgap { fill: var(--peak); stroke: var(--peak-text); stroke-width: 1; stroke-dasharray: 3 2; }
    .tick { stroke: var(--text); stroke-width: 2.5; pointer-events: none; }
    .tick.goal { stroke: var(--peak-text); }
    .headline { font-size: 1.05rem; margin-bottom: 10px; }
    .headline b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

    .sk .n-up, .sk .l-up { fill: var(--anchor-text); }
    .sk .n-tgt { fill: var(--text); }
    .sk .n-used, .sk .l-used { fill: var(--event-text); }
    .sk .n-cut, .sk .l-cut { fill: var(--peak-text); }
    .sk .n-lost, .sk .l-lost, .sk .n-down, .sk .l-down { fill: var(--text-muted); }
    .sk .n-over, .sk .l-over { fill: var(--over); }

    .sk text.nv, .sk tspan.nv { fill: var(--text-muted); font-size: 12px; }

    .cu .orig { stroke: var(--primary); stroke-width: 2; stroke-dasharray: 3 4; }
    .cu .lim { stroke: var(--peak-text); stroke-width: 2; stroke-dasharray: 3 4; }

    .cu text.orig { fill: var(--primary); stroke: none; }
    .cu text.lim { fill: var(--peak-text); stroke: none; }
    .cu text.cliff { fill: var(--text-muted); stroke: none; }
    details.how { margin-top: 12px; }
    details.how summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; }

    .cal { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

    .cal .dn { font-size: 0.7rem; color: var(--text-muted); text-align: center; }
    .cal .d { min-height: 40px; border-radius: 6px; border: 1px solid transparent; padding: 2px; text-align: center; font-size: 0.8rem; font-variant-numeric: tabular-nums; }

// The page's language: #lang= in the URL, else hilo-<location>-ui.json from Hilo Manager, else French.
const hashLang = (l => l === 'fr' || l === 'en' ? l : null)(new URLSearchParams(location.hash.slice(1)).get('lang'));
let LANG = hashLang || 'fr';
const LOC = () => LANG === 'fr' ? 'fr-CA' : 'en-CA';
const t = (key, args = {}) => {
    let s = (I18N[LANG] || {})[key] ?? I18N.en[key] ?? key;
    for (const [k, v] of Object.entries(args)) s = s.split(`{${k}}`).join(v == null ? '' : String(v));
    return s;
};
// The text that is in the HTML before the script runs.
function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t('page.title');
    $('hdrTitle').textContent = t('hdr.title');
    $('toHistory').textContent = t('hdr.toHistory');
    if (!wcSel) $('toHistory').href = `hilo-history.html#lang=${LANG}`;
    $('loc').setAttribute('aria-label', t('hdr.locLabel'));
    $('season').setAttribute('aria-label', t('hdr.seasonLabel'));
    // Both run before the history loads, while these still hold their first text.
    $('range').textContent = t('hdr.loading');
    if ($('status')) $('status').textContent = t('status.listing');
}

// Hydro-Québec's winter credit (Rate D, Winter Credit Option), from Hilo Manager's month files
// (hilo-<location>-energy-YYYY-MM.json) and its last computation (hilo-<location>-peak-target.json).
// The URL hash picks the day and window: #day=YYYY-MM-DD&start=6|16&loc=<location>, and #lang=fr|en the language.
const FILE_RE = /^hilo-(.+)-energy-(\d{4}-\d{2})\.json$/;
// Actual peak events: Hydro-Québec open data, offer CPC-D. The API allows cross-origin reads; times come back in UTC.
const EVENTS_URL = 'https://donnees.hydroquebec.com/api/explore/v2.1/catalog/datasets/evenements-pointe/records';
const EVENT_OFFER = 'CPC-D';
// The credit per kWh curtailed (Electricity Rates, article 2.64), by the date each rate took effect. Winter
// 2025–26 at 56.786 ¢ matches what Hilo credited; earlier rates are not on file, so no dollar amount then.
const CREDIT_RATES = [['2027-04-01', 60.186], ['2026-04-01', 58.490], ['2025-04-01', 56.786]];
const creditCents = day => (CREDIT_RATES.find(([from]) => day >= from) || [])[1] ?? null;
// Rate D's second-tier energy price (article 2.1), the price of each extra kWh on a winter day over the
// 40 kWh first block. The 2027 price is not on file.
const ENERGY_RATES = [['2027-04-01', null], ['2026-04-01', 11.142], ['2025-04-01', 10.652]];
const energyCents = day => (ENERGY_RATES.find(([from]) => day >= from) || [])[1] ?? null;
// Dollars as each language writes them: $12.34 or 12,34 $.
const cash = (v, d = 2) => LANG === 'fr' ? fmt(v, d) + '\u00a0$' : '$' + fmt(v, d);
const money = v => (v < 0 ? '−' : '') + cash(Math.abs(v), 2);
const dollars = (kwh, day) => creditCents(day) == null ? '' : cash(kwh * creditCents(day) / 100, 2);
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => v == null ? '–' : v.toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthShort = i => new Date(2020, i, 15).toLocaleDateString(LOC(), { month: 'short' });
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const dayLabel = d => new Date(d + 'T12:00:00').toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric', month: 'short' });
const hourOf = start => +start.slice(11, 13);
// The winter around a day, named by the year it starts: December to March.
const seasonOf = day => { const m = +day.slice(5, 7); return m === 12 ? +day.slice(0, 4) : m <= 3 ? +day.slice(0, 4) - 1 : null; };

let files = {};      // location -> [{month, name, date}]
let loc = null;
let days = [];       // [{date, hours:[{h, kWh}], total}] sorted
let dayMap = {};     // date -> day
let events = null;   // [{s, e}] epoch seconds; null until loaded or when unavailable
let eventNote = '';
let season = null;   // the winter shown, by its start year
let temps = null;    // {byHour: Map(epoch s -> degrees), unit, seasons: Set}; null until the first winter loads
let tempNote = '';
let wcSel = null;    // {day, start}
let wcHowOpen = false; // the computation's details stay open across days once opened

async function getJson(url, cache = 'no-store') {
    const r = await fetch(url, { cache });
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    return r.json();
}

function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const day = /^\d{4}-\d{2}-\d{2}$/.test(p.get('day') || '') ? p.get('day') : null;
    return { day, start: p.get('start') === '16' ? 16 : 6, loc: p.get('loc') };
}

function writeHash() {
    if (!wcSel) return;
    history.replaceState(null, '', `#day=${wcSel.day}&start=${wcSel.start}&loc=${encodeURIComponent(loc)}` + (hashLang ? `&lang=${hashLang}` : ''));
    $('toHistory').href = `hilo-history.html#day=${wcSel.day}&loc=${encodeURIComponent(loc)}&lang=${LANG}`;
}

async function init() {
    applyStatic();
    let list;
    try {
        list = await getJson('/hub/fileManager/json');
    } catch (e) {
        return fail(t('err.list', { why: e.message }));
    }
    for (const f of list.files || []) {
        const m = FILE_RE.exec(f.name);
        if (m) (files[m[1]] = files[m[1]] || []).push({ month: m[2], name: f.name, date: f.date });
    }
    const locs = Object.keys(files).sort();
    if (!locs.length) return fail(t('err.noFiles'));
    const h = readHash();
    const sel = $('loc');
    const first = locs.includes(h.loc) ? h.loc : locs[0];
    // Without #lang=, the language Hilo Manager last set for the location shown first.
    const ui = !hashLang && (list.files || []).find(f => f.name === `hilo-${first}-ui.json`);
    if (ui) {
        const doc = await getJson(`/local/${encodeURIComponent(ui.name)}?v=${encodeURIComponent(ui.date || Date.now())}`, 'force-cache').catch(() => null);
        if (doc && (doc.lang === 'fr' || doc.lang === 'en') && doc.lang !== LANG) { LANG = doc.lang; applyStatic(); }
    }
    sel.innerHTML = locs.map(l => `<option value="${esc(l)}">${esc(t('loc.option', { id: l }))}</option>`).join('');
    sel.hidden = locs.length < 2;
    sel.onchange = () => loadLocation(sel.value, null);
    $('season').onchange = () => { season = +$('season').value; wcSel = null; render(); withTemps(); };
    addEventListener('hashchange', () => {
        const x = readHash();
        if (x.day && (!wcSel || x.day !== wcSel.day || x.start !== wcSel.start)) { wcSel = { day: x.day, start: x.start }; season = seasonOf(x.day) ?? season; render(); }
    });
    sel.value = first;
    await loadLocation(first, h.day ? { day: h.day, start: h.start } : null);
}

// The hub sends no cache headers; File Manager's modification time in the URL lets the browser
// keep each month file until it changes.
const monthUrl = f => `/local/${encodeURIComponent(f.name)}?v=${encodeURIComponent(f.date || Date.now())}`;

async function loadLocation(l, want) {
    loc = l;
    $('status') && ($('status').textContent = t('status.reading'));
    const list = files[l].sort((a, b) => a.month.localeCompare(b.month));
    const docs = await Promise.all(list.map(f => getJson(monthUrl(f), 'force-cache').catch(() => null)));
    const all = {};
    docs.forEach(d => Object.assign(all, (d && d.days) || {}));
    days = Object.keys(all).sort().map(date => {
        const hours = (all[date] || []).map(x => ({ h: hourOf(x.start), at: Date.parse(x.start) / 1000, kWh: x.kWh == null ? null : +x.kWh }));
        return { date, hours, total: hours.reduce((s, x) => s + (x.kWh || 0), 0) };
    });
    dayMap = Object.fromEntries(days.map(d => [d.date, d]));
    if (!days.length) return fail(t('err.noDays'));
    wcFile = await getJson('/local/' + encodeURIComponent(`hilo-${l}-peak-target.json`)).catch(() => null);
    events = null;
    eventNote = t('ev.loading');
    wcSel = want;
    pickSeason();
    render();
    withTemps();
    loadEvents().then(() => { pickSeason(); render(); }, e => { eventNote = t('ev.unavailable', { why: e.message }); render(); });
}

// Outdoor temperature from Open-Meteo's historical API at the hub's coordinates, one winter at a time,
// asked in UTC epoch seconds as the history page does. Each hour on file gets x.t.
const TEMP_URL = 'https://archive-api.open-meteo.com/v1/archive';
let hubPlace = null;
async function loadSeasonTemps(s) {
    if (temps && temps.seasons.has(s)) return;
    hubPlace = hubPlace || await getJson('/hub/details/json');
    if (hubPlace.latitude == null || hubPlace.longitude == null) throw new Error(t('temp.noHubLocation'));
    const unit = hubPlace.tempScale === 'F' ? 'F' : 'C';
    const today = new Date().toISOString().slice(0, 10), end = `${s + 1}-04-01` < today ? `${s + 1}-04-01` : today;
    const q = new URLSearchParams({ latitude: hubPlace.latitude, longitude: hubPlace.longitude, start_date: `${s}-11-20`, end_date: end,
        hourly: 'temperature_2m', timezone: 'GMT', timeformat: 'unixtime', temperature_unit: unit === 'F' ? 'fahrenheit' : 'celsius' });
    const r = await fetch(`${TEMP_URL}?${q}`);
    if (!r.ok) throw new Error(`Open-Meteo HTTP ${r.status}`);
    const h = (await r.json()).hourly || {};
    temps = temps || { byHour: new Map(), unit, seasons: new Set() };
    (h.time || []).forEach((t, i) => { if (h.temperature_2m[i] != null) temps.byHour.set(t, h.temperature_2m[i]); });
    temps.seasons.add(s);
    days.forEach(d => d.hours.forEach(x => { if (temps.byHour.has(x.at)) x.t = temps.byHour.get(x.at); }));
    // French writes the decimal comma, so its coordinates are kept apart with a semicolon.
    tempNote = t('temp.note', { coords: fmt(+hubPlace.latitude, 2) + (LANG === 'fr' ? ' ; ' : ', ') + fmt(+hubPlace.longitude, 2) });
}
const deg = (v, d = 1) => v == null ? '–' : fmt(v, d) + ' °' + (temps ? temps.unit : 'C');
// Mean outdoor temperature of a day's clock hours (all hours when none are given).
function tempOf(day, hrs) {
    const d = dayMap[day];
    if (!d) return null;
    const v = d.hours.filter(x => x.t != null && (!hrs || hrs.includes(x.h))).map(x => x.t);
    return v.length && (!hrs || v.length === hrs.length) ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function withTemps() {
    if (season == null) return;
    tempNote = tempNote || t('temp.loading');
    loadSeasonTemps(season).then(render, e => { tempNote = t('temp.unavailable', { why: e.message }); render(); });
}

// Every winter with history or an event; the chosen day's winter, else the latest.
function pickSeason() {
    const ss = new Set(days.map(d => seasonOf(d.date)).filter(s => s != null));
    wcSlots().forEach(x => { const s = seasonOf(x.day); if (s != null) ss.add(s); });
    const list = [...ss].sort((a, b) => b - a);
    const sel = $('season');
    sel.innerHTML = list.map(s => `<option value="${s}">${esc(t('season.option', { s, e: String(s + 1).slice(2) }))}</option>`).join('');
    const want = wcSel && seasonOf(wcSel.day);
    season = want != null ? want : list.includes(season) ? season : list[0];
    if (season != null) sel.value = String(season);
    const first = days[0].date, last = days[days.length - 1].date;
    $('range').textContent = t('range', { from: dayName(first), to: dayName(last) });
}

async function loadEvents() {
    const out = [];
    for (let offset = 0; offset < 1000; offset += 100) {
        const q = new URLSearchParams({ order_by: 'datedebut', limit: 100, offset, refine: `offre:"${EVENT_OFFER}"` });
        const r = await fetch(`${EVENTS_URL}?${q}`);
        if (!r.ok) throw new Error(`Hydro-Québec HTTP ${r.status}`);
        const page = (await r.json()).results || [];
        page.forEach(x => {
            const s = Date.parse(x.datedebut) / 1000, e = Date.parse(x.datefin) / 1000;
            if (s && e) out.push({ s, e });
        });
        if (page.length < 100) break;
    }
    events = out;
    eventNote = t('ev.note', { offer: EVENT_OFFER, plus: wcFile && wcFile.events ? t('ev.notePlus') : '' });
}

function fail(msg) {
    $('main').innerHTML = `<div class="card msg muted">${esc(msg)}</div>`;
    $('range').textContent = '';
}

const tile = (v, l) => `<div class="card tile"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;

// Bar chart helper: values [{label, value, cls, key}], returns SVG markup.
// shade: [{a, b, cls}] bar-index ranges drawn behind the bars. overlay: values on the bars' own scale,
// drawn as a line with points, null for gaps. hline: values drawn as dashed horizontal lines.
function bars(vals, { height = 220, labelEvery = 1, shade = [], fmtTip, unitDigits = 1, overlay = null, hline = [], line = null } = {}) {
    if (overlay && !overlay.some(v => v != null)) overlay = null;
    if (line && !line.some(v => v != null)) line = null;
    const W = 1000, H = height, L = 44, R = line ? 40 : 8, T = 12, B = 26;
    const max = Math.max(...vals.map(v => Math.max(v.value || 0, v.goal || 0, v.ref || 0)), ...(overlay || []).map(v => v || 0), ...hline.map(v => v * 1.08), 0.001);
    const step = niceStep(max);
    const top = Math.ceil(max / step) * step;
    const bw = (W - L - R) / vals.length;
    const y = v => T + (H - T - B) * (1 - v / top);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    shade.forEach(({ a, b, cls }) => s += `<rect class="${cls}" x="${L + a * bw}" y="${T}" width="${(b - a) * bw}" height="${H - T - B}"/>`);
    for (let g = 0; g <= top + 1e-9; g += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmt(g, Number.isInteger(step) ? 0 : 1)}</text>`;
    vals.forEach((v, i) => {
        const x = L + i * bw, h = v.value == null ? 0 : (H - T - B) * (v.value / top);
        if (v.value != null) s += `<rect class="bar ${v.cls || ''}" x="${x + bw * 0.12}" y="${y(v.value)}" width="${Math.max(bw * 0.76, 1)}" height="${h}" rx="${Math.min(2, bw / 6)}"/>`;
        // v.ref: a tick at the hour's usual use; v.over: the part above it in its own colour.
        // v.goal: a tick at the hour's share of the target, the gap below it outlined as curtailed.
        const bx = x + bw * 0.12, bwid = Math.max(bw * 0.76, 1);
        if (v.over && v.ref != null && v.value > v.ref) s += `<rect class="bar over" x="${bx}" y="${y(v.value)}" width="${bwid}" height="${y(v.ref) - y(v.value)}"/>`;
        if (v.goal != null && v.goal > (v.value || 0)) s += `<rect class="cutgap" x="${bx}" y="${y(v.goal)}" width="${bwid}" height="${y(v.value || 0) - y(v.goal)}"/>`;
        if (v.ref != null) s += `<line class="tick" x1="${x + bw * 0.04}" x2="${x + bw * 0.96}" y1="${y(v.ref)}" y2="${y(v.ref)}"/>`;
        if (v.goal != null) s += `<line class="tick goal" x1="${x + bw * 0.04}" x2="${x + bw * 0.96}" y1="${y(v.goal)}" y2="${y(v.goal)}"/>`;
        s += `<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H - T - B}" data-k="${esc(v.key ?? '')}" data-tip="${esc(fmtTip ? fmtTip(v) : v.label + ': ' + fmt(v.value, unitDigits))}"/>`;
        if (i % labelEvery === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(v.label)}</text>`;
    });
    hline.forEach(v => s += `<line class="hline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`);
    if (overlay) {
        let d = '';
        overlay.forEach((v, i) => { if (v != null) { d += `${i && overlay[i - 1] != null ? 'L' : 'M'}${L + (i + 0.5) * bw},${y(v)}`; s += `<circle class="ovdot" cx="${L + (i + 0.5) * bw}" cy="${y(v)}" r="3"/>`; } });
        s += `<path class="ovline" d="${d}"/>`;
    }
    // line: outdoor temperature on its own scale, labelled on the right.
    if (line) {
        const known = line.filter(v => v != null), ts = niceStep(Math.max(Math.max(...known) - Math.min(...known), 1));
        const lo = Math.floor(Math.min(...known) / ts) * ts, hi = Math.max(Math.ceil(Math.max(...known) / ts) * ts, lo + ts);
        const ly = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
        for (let g = lo; g <= hi + 1e-9; g += ts) s += `<text class="taxis" x="${W - R + 6}" y="${ly(g) + 4}">${fmt(g, Number.isInteger(ts) ? 0 : 1)}°</text>`;
        let d = '';
        line.forEach((v, i) => { if (v != null) d += `${i && line[i - 1] != null ? 'L' : 'M'}${L + (i + 0.5) * bw},${ly(v)}`; });
        s += `<path class="tline" d="${d}"/>`;
    }
    return s + '</svg>';
}

function niceStep(max) {
    const raw = max / 5, p = Math.pow(10, Math.floor(Math.log10(raw)));
    return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= raw);
}

function wire(el, onClick) {
    el.querySelectorAll('.hit').forEach(r => {
        r.addEventListener('mousemove', e => { const t = $('tip'); t.textContent = r.dataset.tip; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8) + 'px'; t.style.top = (e.clientY - 34) + 'px'; });
        r.addEventListener('mouseleave', () => $('tip').style.display = 'none');
        if (onClick) r.addEventListener('click', () => onClick(r.dataset.k));
    });
}

// ── Winter credit target ──────────────────────────────────────────────
// The same computation as Hilo Manager's peakTarget (Hydro-Québec Electricity Rates, article 2.59):
// base = the event hours' means over 5 reference days without their lowest and highest values;
// target = base + (anchor use − anchor reference) × event hours / anchor hours; past 40 kWh curtailed
// the adjustment is at most 2 × the anchor reference × the same factor. Days are 'YYYY-MM-DD' strings.
const WC_CAP = 40;
let wcFile = null;  // Hilo Manager's last computation (hilo-<location>-peak-target.json), or null

function ymd(day) { const [y, m, d] = day.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function addDays(day, n) { const t = ymd(day); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function isWeekend(day) { const w = ymd(day).getUTCDay(); return w === 0 || w === 6; }

function easterSunday(year) {
    const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
    const g = Math.floor((8 * b + 13) / 25), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), n = h + l - 7 * m + 114;
    return `${year}-${String(Math.floor(n / 31)).padStart(2, '0')}-${String(n % 31 + 1).padStart(2, '0')}`;
}

// Days without peak hours in the winter around `day`: Dec 24, 25, 26, 31, Jan 1, 2, Good Friday, Easter Monday.
function noPeakDays(day) {
    const y = +day.slice(0, 4), w = +day.slice(5, 7) >= 7 ? y : y - 1, e = easterSunday(w + 1);
    return new Set([`${w}-12-24`, `${w}-12-25`, `${w}-12-26`, `${w}-12-31`, `${w + 1}-01-01`, `${w + 1}-01-02`, addDays(e, -2), addDays(e, 1)]);
}

// hours: {day: {hour: kWh}}. Returns the same fields as Hilo Manager's peakTarget.
function peakTarget(hours, day, startHour, eventDays, floor, anchorActual) {
    const weekend = isWeekend(day), noPeak = noPeakDays(day);
    const back = startHour < 12 ? 5 : 4, alen = startHour < 12 ? 3 : 2, k = 4 / alen;
    const refDays = [], skipped = [];
    let d = day;
    for (let i = 0; i < 60 && refDays.length < 5; i++) {
        d = addDays(d, -1);
        if (isWeekend(d) !== weekend) continue;
        if (noPeak.has(d)) skipped.push([d, 'no peak hours']);
        else if (eventDays.has(d)) skipped.push([d, 'event']);
        else refDays.push(d);
    }
    const anchorHours = Array.from({ length: alen }, (_, i) => startHour - back + i);
    const eventHours = [0, 1, 2, 3].map(i => startHour + i);
    const missing = [], rows = [];
    let base = 0, anchorRef = 0;
    for (const h of [...anchorHours, ...eventHours]) {
        const values = refDays.map(r => {
            const v = hours[r] ? hours[r][h] : undefined;
            if (v == null) missing.push(`${r} ${h}:00`);
            return v == null ? null : v;
        });
        const idx = values.map((_, i) => i).filter(i => values[i] != null);
        let low = null, high = null;
        if (idx.length >= 3) {
            low = idx.reduce((a, i) => values[i] < values[a] ? i : a);
            high = idx.filter(i => i !== low).reduce((a, i) => values[i] > values[a] ? i : a);
        }
        const kept = idx.filter(i => i !== low && i !== high).map(i => values[i]);
        const mean = kept.length ? kept.reduce((s, v) => s + v, 0) / kept.length : 0;
        if (eventHours.includes(h)) base += mean; else anchorRef += mean;
        rows.push({ hour: h, anchor: anchorHours.includes(h), values, low, high, mean });
    }
    const capped = base + k * 2 * anchorRef;
    const out = { day, startHour, refDays, skipped, rows, missing, anchorHours, base, anchorRef, k, cappedTarget: capped, floor };
    if (capped - floor >= WC_CAP) {
        out.anchorPlan = 'at least'; out.anchorTarget = 3 * anchorRef; out.expectedCut = capped - floor;
    } else {
        out.anchorPlan = 'at most';
        out.anchorTarget = Math.max((WC_CAP + floor - base) / k + anchorRef, 0);
        out.expectedCut = Math.min(base + k * (out.anchorTarget - anchorRef) - floor, WC_CAP);
    }
    if (anchorActual != null) {
        const target = base + k * (anchorActual - anchorRef);
        out.target = target;
        out.cut = Math.max(curtailed(target, capped, floor), 0);
        const keep = target - WC_CAP;
        const keepPays = keep > floor && WC_CAP * 58.490 - (keep - floor) * 11.142 > out.cut * 58.490;
        out.keepUse = keepPays ? keep : null;
        out.advice = keepPays ? 'keep' : 'cut';
    }
    return out;
}

// Curtailment for an event use; past 40 kWh, against the limited target.
function curtailed(target, capped, used) {
    const c = target - used;
    return Math.max(c > WC_CAP && target > capped ? capped - used : c, 0);
}

// Local day and start hour of every known event: the open data plus Hilo Manager's extra events.
function wcSlots() {
    const out = new Map();
    (events || []).forEach(v => {
        const t = new Date(v.s * 1000);
        const day = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
        out.set(`${day}|${t.getHours()}`, { day, start: t.getHours() });
    });
    ((wcFile && wcFile.events) || []).forEach(([day, start]) => out.set(`${day}|${start}`, { day, start }));
    return [...out.values()].sort((a, b) => (a.day + String(a.start).padStart(2, '0')).localeCompare(b.day + String(b.start).padStart(2, '0')));
}

let hoursCache = null;
function wcHours() {
    if (hoursCache && hoursCache.days === days) return hoursCache.map;
    const out = {};
    days.forEach(d => { const m = out[d.date] = {}; d.hours.forEach(x => { if (x.kWh != null) m[x.h] = (m[x.h] || 0) + x.kWh; }); });
    hoursCache = { days, map: out };
    return out;
}

// The computation for a window: Hilo Manager's own when it has one (it includes today's hours),
// else computed here from the history files, with the event day's own use when it is on file.
function wcCompute(day, start) {
    const floor = wcFile ? +wcFile.floor : 3;
    const slots = wcSlots();
    const isEvent = slots.some(x => x.day === day && x.start === start);
    const fromApp = wcFile && (wcFile.results || []).find(r => r.day === day && r.startHour === start);
    if (fromApp) return { ...fromApp, event: fromApp.event ?? isEvent, source: t('src.app', { when: wcFile.generated.replace('T', ' ').slice(0, 16) }) };
    const hours = wcHours();
    const back = start < 12 ? 5 : 4, alen = start < 12 ? 3 : 2;
    const own = hours[day];
    const anchor = own ? Array.from({ length: alen }, (_, i) => own[start - back + i]) : [];
    const anchorActual = anchor.length && anchor.every(v => v != null) ? anchor.reduce((s, v) => s + v, 0) : null;
    const r = peakTarget(hours, day, start, new Set(slots.filter(x => x.day !== day).map(x => x.day)), floor, anchorActual);
    const used = own ? [0, 1, 2, 3].map(i => own[start + i]) : [];
    if (used.length && used.every(v => v != null)) r.used = used.reduce((s, v) => s + v, 0);
    r.event = isEvent;
    r.source = t('src.page');
    return r;
}

// The winter's events with history on file, scored as Hydro-Québec would.
function seasonEvents() {
    return wcSlots().filter(x => seasonOf(x.day) === season && dayMap[x.day]).map(x => {
        const r = wcCompute(x.day, x.start);
        const scored = r.target != null && r.used != null && !(r.missing || []).length;
        const c = scored ? curtailed(r.target, r.cappedTarget, r.used) : null;
        return { x, r, scored, c, capped: scored && r.target - r.used > WC_CAP && r.target > r.cappedTarget };
    });
}

// ── Page ──────────────────────────────────────────────────────────────
function render() {
    if (season == null) return fail(t('err.noWinter'));
    const slots = wcSlots();
    if (!wcSel || seasonOf(wcSel.day) !== season) {
        const next = wcFile && (wcFile.results || []).find(r => r.event && seasonOf(r.day) === season);
        const last = slots.filter(x => seasonOf(x.day) === season && dayMap[x.day]).pop();
        const lastDay = days.filter(d => seasonOf(d.date) === season).pop();
        wcSel = next ? { day: next.day, start: next.startHour } : last ? { day: last.day, start: last.start } :
            { day: lastDay ? lastDay.date : `${season}-12-01`, start: 6 };
    }
    const evs = seasonEvents(), scored = evs.filter(e => e.scored);
    const allInSeason = slots.filter(x => seasonOf(x.day) === season);
    const kwh = scored.reduce((s, e) => s + e.c, 0), yy = String(season + 1).slice(2);
    $('main').innerHTML = `
    <div class="tiles">
        ${tile(String(allInSeason.length), t('tile.events', { s: season, e: yy }) + (scored.length < allInSeason.length ? ' ' + t('tile.eventsPartial', { n: scored.length }) : ''))}
        ${tile(scored.length ? fmt(kwh) + ' kWh' : '–', t('tile.curtailed', { n: scored.length }))}
        ${tile(scored.length ? `${scored.filter(e => e.capped).length}` : '–', t('tile.limited'))}
        ${tile(scored.length && scored.every(e => creditCents(e.x.day) != null) ? cash(scored.reduce((a, e) => a + e.c * creditCents(e.x.day) / 100, 0), 0) : '–', t('tile.credit', { rates: [...new Set(scored.map(e => creditCents(e.x.day)).filter(v => v != null))].map(v => fmt(v, 3)).join(' / ') || '–' }))}
    </div>
    ${season < 2025 ? `<div class="card legend" style="border-color:var(--peak-text)">${t('note.oldRules')}</div>` : ''}
    <div class="card"><h2><span>${t('season.option', { s: season, e: yy })}</span><span class="legend">${t('cal.legend')}</span></h2>
        <div class="cal" id="cal"></div><div class="legend" style="margin-top:6px">${esc(eventNote)}</div><div class="legend">${esc(tempNote)}</div></div>
    <div class="card"><h2><span id="dayTitle"></span><span class="bar-ctl">
        <button id="wcAm">AM 06–10</button><button id="wcPm">PM 16–20</button>
        <button id="wcPrev" title="${t('btn.prevTitle')}">${t('btn.prev')}</button><button id="wcNext" title="${t('btn.nextTitle')}">${t('btn.next')}</button>
        <a id="dayHistory" href="#">${t('lnk.dayHistory')}</a></span></h2>
        <div id="hourly"></div>
        <div class="legend" style="margin-top:6px">${t('hourly.legend')}</div></div>
    <div class="card"><h2><span>${t('term.refEnergy')}</span><span class="legend" id="wcSource"></span></h2><div id="wc"></div></div>
    ${scored.length ? `<div class="card"><h2><span>${t('card.evChart')}</span><span class="legend">${t('card.evChartLegend')}</span></h2><div id="evchart"></div></div>` : ''}
    <div class="card"><h2><span>${t('card.evTable')}</span><span class="legend">${t('card.evTableLegend')}</span></h2><div class="scroll" id="evtable"></div></div>`;
    drawSelection();
}

// Everything that follows the chosen day and window.
function drawSelection() {
    writeHash();
    drawCalendar();
    drawDay();
    drawWc();
    drawEvents();
}

function select(day, start) {
    if (start == null) {
        const own = wcSlots().filter(x => x.day === day);
        start = own.length ? (own.some(x => x.start === wcSel.start) ? wcSel.start : own[0].start) : wcSel.start;
    }
    wcSel = { day, start };
    drawSelection();
}

function drawCalendar() {
    const el = $('cal');
    const slots = wcSlots(), np = noPeakDays(`${season}-12-01`);
    const appDays = new Set(((wcFile && wcFile.results) || []).map(r => r.day));
    const months = [[season, 12], [season + 1, 1], [season + 1, 2], [season + 1, 3]];
    el.innerHTML = months.map(([y, m]) => {
        const first = new Date(Date.UTC(y, m - 1, 1)), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
        let s = `<div><h3>${esc(monthShort(m - 1))} ${y}</h3><div class="wk">` + t('cal.dow').split(' ').map(x => `<div class="dn">${x}</div>`).join('');
        for (let i = 0; i < first.getUTCDay(); i++) s += '<div></div>';
        for (let d = 1; d <= n; d++) {
            const day = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const ev = slots.filter(x => x.day === day);
            const on = !!dayMap[day] || appDays.has(day);
            const tip = dayName(day) + (ev.length ? ' · ' + t('tip.peakEvent', { slots: ev.map(x => x.start < 12 ? 'AM' : 'PM').join(' + ') }) : '') +
                (np.has(day) ? ' · ' + t('tip.noPeak') : '') + (dayMap[day] ? ` · ${fmt(dayMap[day].total)} kWh` : ' · ' + t('tip.noHistory')) +
                (tempOf(day) != null ? ' · ' + t('tip.meanOut', { t: deg(tempOf(day)) }) : '');
            s += `<div class="d ${on ? 'on' : 'off'}${ev.length ? ' ev' : ''}${np.has(day) ? ' np' : ''}${day === wcSel.day ? ' sel' : ''}" ${on ? `data-d="${day}"` : ''} title="${esc(tip)}">${d}` + (tempOf(day) != null ? `<span class="t">${fmt(tempOf(day), 0)}°</span>` : '') +
                ev.map(x => `<span class="slot">${x.start < 12 ? 'AM' : 'PM'}</span>`).join('') + '</div>';
        }
        return s + '</div></div>';
    }).join('');
    el.querySelectorAll('.d.on').forEach(c => c.onclick = () => select(c.dataset.d));
}

function drawDay() {
    const r = wcCompute(wcSel.day, wcSel.start);
    const d = dayMap[wcSel.day];
    const back = wcSel.start < 12 ? 5 : 4, alen = wcSel.start < 12 ? 3 : 2;
    const tk = d ? d.hours.filter(x => x.t != null).map(x => x.t) : [];
    $('dayTitle').textContent = `${dayName(wcSel.day)}${d ? t('day.total', { v: fmt(d.total) }) : ''} · ${r.event ? t('day.peakEvent', { slot: wcSel.start < 12 ? 'AM' : 'PM' }) : t('day.notEvent')}` +
        (tk.length ? ' · ' + t('day.outdoors', { lo: deg(Math.min(...tk)), hi: deg(Math.max(...tk)) }) : '');
    $('wcAm').className = wcSel.start < 12 ? 'on' : ''; $('wcPm').className = wcSel.start >= 12 ? 'on' : '';
    $('wcAm').onclick = () => select(wcSel.day, 6); $('wcPm').onclick = () => select(wcSel.day, 16);
    const slots = wcSlots(), key = s => s.day + String(s.start).padStart(2, '0');
    const prev = slots.filter(x => key(x) < key(wcSel)).pop(), next = slots.find(x => key(x) > key(wcSel));
    $('wcPrev').disabled = !prev; $('wcNext').disabled = !next;
    $('wcPrev').onclick = () => { season = seasonOf(prev.day); $('season').value = String(season); wcSel = { ...prev }; render(); };
    $('wcNext').onclick = () => { season = seasonOf(next.day); $('season').value = String(season); wcSel = { ...next }; render(); };
    $('dayHistory').href = `hilo-history.html#day=${wcSel.day}&loc=${encodeURIComponent(loc)}&lang=${LANG}`;
    $('dayHistory').hidden = !d;
    // Hours by their clock hour; a 23- or 25-hour day keeps its own list.
    const hours = d ? d.hours : Array.from({ length: 24 }, (_, h) => ({ h, kWh: null }));
    const idx = h => hours.findIndex(x => x.h === h);
    const ref = Object.fromEntries(r.rows.map(x => [x.hour, x.mean]));
    const anchorH = new Set(r.rows.filter(x => x.anchor).map(x => x.hour)), eventH = new Set(r.rows.filter(x => !x.anchor).map(x => x.hour));
    // The target spread over the event hours: each hour's usual use plus a quarter of the adjustment.
    const eff = effTarget(r), share = eff == null ? null : (eff - r.base) / 4;
    const span = (h0, n, cls) => { const a = idx(h0), b = idx(h0 + n - 1); return a < 0 || b < 0 ? [] : [{ a, b: b + 1, cls }]; };
    const shade = [...span(wcSel.start - back, alen, 'anchor'), ...span(wcSel.start, 4, r.event ? 'event' : 'peak')];
    const el = $('hourly');
    el.innerHTML = (d ? '' : `<div class="legend">${t('hourly.noHours')}</div>`) +
        bars(hours.map((x, i) => ({ key: i, value: x.kWh, label: String(x.h),
            ref: anchorH.has(x.h) ? ref[x.h] : null, over: anchorH.has(x.h),
            goal: eventH.has(x.h) && share != null ? Math.max(ref[x.h] + share, 0) : null })), { height: 200, shade, unitDigits: 2,
            line: hours.map(x => x.t ?? null),
            fmtTip: v => { const x = hours[v.key]; return t('tip.hour', { a: `${x.h}:00`, b: `${x.h + 1}:00`, v: x.kWh == null ? t('tip.noValue') : fmt(x.kWh, 2) + ' kWh' }) +
                (anchorH.has(x.h) ? ' · ' + t('tip.refPeriod', { v: fmt(ref[x.h], 2) }) : '') + (eventH.has(x.h) && share != null ? ' · ' + t('tip.share', { v: fmt(ref[x.h] + share, 2) }) : '') +
                (x.t != null ? ` · ${deg(x.t)}` : ''); } });
    wire(el);
}

// The target that counts: the limited one past 40 kWh curtailed; before the anchor is known, the plan's.
function effTarget(r) {
    if (r.target == null) return r.anchorPlan === 'at most' ? r.floor + WC_CAP : r.cappedTarget;
    if (r.used == null) return r.target;
    return r.used + curtailed(r.target, r.cappedTarget, r.used);
}

// The event's options, in credit and in energy: cut to the floor, what was consumed, and consuming just
// enough to curtail exactly 40 kWh, each against cutting to the floor.
function eventOptions(r) {
    if (r.target == null || r.used == null) return null;
    const cc = creditCents(r.day), ec = energyCents(r.day), floor = r.floor;
    const row = (label, used) => {
        const c = curtailed(r.target, r.cappedTarget, used), extra = Math.max(used - floor, 0);
        const credit = cc == null ? null : c * cc / 100, energy = ec == null ? null : extra * ec / 100;
        return { label, used, c, extra, credit, energy, net: credit == null || energy == null ? null : credit - energy };
    };
    const rows = [row(t('opt.floor', { v: fmt(floor) }), floor), row(t('opt.asConsumed'), r.used)];
    const keep = r.target - WC_CAP;
    if (r.target > r.cappedTarget && keep > floor && Math.abs(keep - r.used) > 0.05) rows.push(row(t('opt.exact40'), keep));
    const [best, actual] = rows;
    const ordered = rows.slice().sort((a, b) => a.used - b.used);
    const table = `<div class="scroll" style="margin:6px 0 10px"><table><tr><th>${t('opt.thUse')}</th><th>kWh</th><th>${t('opt.thCut')}</th><th>${t('opt.thCredit')}</th><th>${t('opt.thAbove')}</th><th>${t('opt.thNet')}</th><th>${t('opt.thCompare', { v: fmt(floor) })}</th></tr>` +
        ordered.map(x => `<tr${x === actual ? ' class="selrow"' : ''}><td>${esc(x.label)}</td><td>${fmt(x.used)}</td><td>${fmt(x.c)}</td><td>${x.credit == null ? '–' : money(x.credit)}</td>` +
            `<td>${fmt(x.extra)} kWh${x.energy == null ? '' : ', ' + money(x.energy)}</td><td>${x.net == null ? '–' : money(x.net)}</td><td>${x === best || x.net == null || best.net == null ? '' : t(x.net < best.net ? 'opt.less' : 'opt.more', { v: cash(Math.abs(x.net - best.net), 2) })}</td></tr>`).join('') +
        `</table><div class="legend">${t('opt.legend', { cc: cc == null ? '–' : fmt(cc, 3), ec: ec == null ? '–' : fmt(ec, 3) })}</div></div>`;
    // Consuming up to the 40 kWh point pays only when the limit keeps a deep cut under 40 kWh.
    const keepRow = rows[2] && rows[2].net != null && best.net != null && rows[2].net > best.net ? rows[2] : null;
    return { table, keep: keepRow && { used: keepRow.used, gain: keepRow.net - best.net } };
}

// Through the event, hour by hour and summed: the consumption against the reference energy, as the Hilo
// app draws it. Lines: the reference energy, the one with the limit, and the consumption that curtails
// exactly 40 kWh, below which the limit applies.
function cumulative(r) {
    const own = wcHours()[r.day] || {};
    const hrs = [0, 1, 2, 3].map(i => r.startHour + i);
    const ref = Object.fromEntries(r.rows.map(x => [x.hour, x.mean]));
    const tgt = r.target != null ? r.target : r.cappedTarget;
    const share = (tgt - r.base) / 4;
    const refCum = [0], usedCum = [0];
    hrs.forEach((h, i) => {
        refCum.push(refCum[i] + Math.max(ref[h] + share, 0));
        if (usedCum.length === i + 1 && own[h] != null) usedCum.push(usedCum[i] + own[h]);
    });
    const lines = [];
    if (r.target != null) lines.push({ v: r.target, cls: 'orig', label: t('cu.ref', { v: fmt(r.target) }) });
    lines.push({ v: r.cappedTarget, cls: 'lim', label: t('cu.lim', { v: fmt(r.cappedTarget) }) });
    if (r.target != null && r.target - WC_CAP > 0 && r.target > r.cappedTarget) lines.push({ v: r.target - WC_CAP, cls: 'cliff', label: t('cu.cliff', { v: fmt(r.target - WC_CAP) }) });
    const W = 1000, H = 240, L = 44, R = 230, T = 12, B = 26;
    const top = Math.max(...refCum, ...usedCum, ...lines.map(l => l.v)) * 1.08;
    const step = niceStep(top), ytop = Math.ceil(top / step) * step;
    const x = i => L + (W - L - R) * i / 4, y = v => T + (H - T - B) * (1 - v / ytop);
    const area = pts => `M${x(0)},${y(0)} ` + pts.map((v, i) => `L${x(i)},${y(v)}`).join(' ') + ` L${x(pts.length - 1)},${y(0)} Z`;
    let s = `<svg class="cu" viewBox="0 0 ${W} ${H}" role="img">`;
    for (let g = 0; g <= ytop + 1e-9; g += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmt(g, 0)}</text>`;
    s += `<path class="ref" d="${area(refCum)}"/>`;
    if (usedCum.length > 1) s += `<path class="used" d="${area(usedCum)}"/>`;
    // Labels at the right, nudged apart when lines are close.
    let lastY = -99;
    lines.slice().sort((a, b) => b.v - a.v).forEach(l => {
        const ly = Math.max(y(l.v) + 4, lastY + 14); lastY = ly;
        s += `<line class="${l.cls}" x1="${L}" x2="${W - R}" y1="${y(l.v)}" y2="${y(l.v)}"/><text class="${l.cls}" x="${W - R + 8}" y="${ly}">${esc(l.label)}</text>`;
    });
    hrs.concat(r.startHour + 4).forEach((h, i) => s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${String(h).padStart(2, '0')}:00</text>`);
    return s + `</svg><div class="legend">${t('cu.legend')}` +
        (usedCum.length > 1 ? ' · ' + t('cu.used', { v: fmt(usedCum[usedCum.length - 1]), soFar: usedCum.length < 5 ? t('cu.soFar') : '' }) : '') + `</div>`;
}

// Ribbons: what makes the target (usual use, plus or minus the anchor adjustment) and where it goes
// (used, curtailed, over the limit). Before the event, the split shown is for a cut to the floor.
function sankey(r) {
    if (r.target == null) return '';
    const anc = r.startHour < 12 ? '01:00–04:00' : '12:00–14:00', win = r.startHour < 12 ? '06:00–10:00' : '16:00–20:00';
    const tgt = r.target, plan = r.used == null, used = plan ? r.floor : r.used;
    const c = curtailed(tgt, r.cappedTarget, used);
    // Past 40 kWh curtailed the raise from the anchor counts only up to twice its usual use.
    const limited = used + c < tgt, eff = limited ? r.cappedTarget : tgt;
    const N = [], Lk = [];
    const node = (col, v, cls, label, sub) => (N.push({ col, v, cls, label, sub }), N.length - 1);
    const link = (a, b, v, cls, label) => { if (v > 1e-6) Lk.push({ a, b, v, cls, label }); };
    const k = r.startHour < 12 ? '4/3' : '2';
    const base = node(0, r.base, 'base', t('sk.base', { win }), `${fmt(r.base)} kWh`);
    const up = tgt > r.base ? node(0, tgt - r.base, 'up', t('term.adjustment'), t('sk.adjSub', { v: '+' + fmt(tgt - r.base), anc })) : null;
    const T = node(1, eff, 'tgt', t('term.refEnergy'), `${fmt(eff)} kWh`);
    const lost = limited ? node(1, tgt - eff, 'lost', t('sk.lost'), t('sk.lostSub', { v: fmt(tgt - eff) })) : null;
    const down = tgt < r.base ? node(1, r.base - tgt, 'down', t('term.adjustment'), t('sk.adjSub', { v: '−' + fmt(r.base - tgt), anc })) : null;
    const over = used > eff ? node(1, used - eff, 'over', t('sk.over'), `${fmt(used - eff)} kWh`) : null;
    const U = node(2, used, 'used', plan ? t('sk.cutTo', { v: fmt(r.floor) }) : t('sk.consumed'), `${fmt(used)} kWh`);
    const C = c > 0 ? node(2, c, 'cut', plan ? t('sk.wouldCut') : t('term.curtailed'), `${fmt(c)} kWh` + (dollars(c, r.day) ? ` · ${dollars(c, r.day)}` : '')) : null;
    link(base, T, Math.min(r.base, eff), 'base');
    // When the adjustment splits, its branch into the reference energy says how much of it counts.
    if (up != null) link(up, T, eff - r.base, 'up', limited ? t('sk.counted', { v: fmt(eff - r.base) }) : null);
    if (lost != null) link(up, lost, tgt - eff, 'lost');
    if (down != null) link(base, down, r.base - tgt, 'down');
    link(T, U, Math.min(used, eff), 'used');
    if (over != null) link(over, U, used - eff, 'over');
    if (C != null) link(T, C, c, 'cut');
    const W = 1000, H = 230, gap = 16, nw = 12, colX = [250, 500, 780];
    const cols = [0, 1, 2].map(k => N.filter(n => n.col === k));
    const sc = Math.min(...cols.map(ns => (H - 44 - gap * (ns.length - 1)) / Math.max(ns.reduce((s, n) => s + n.v, 0), 0.001)));
    cols.forEach(ns => { let y = 34; ns.forEach(n => { n.y = y; n.h = Math.max(n.v * sc, 1); n.out = y; n.in = y; y += n.h + gap; }); });
    let s = `<svg class="sk" viewBox="0 0 ${W} ${H}" role="img">`;
    Lk.forEach(l => {
        const a = N[l.a], b = N[l.b], h = l.v * sc, x0 = colX[a.col] + nw, x1 = colX[b.col], m = (x0 + x1) / 2;
        const s0 = a.out, t0 = b.in; a.out += h; b.in += h;
        s += `<path class="l-${l.cls}" d="M${x0},${s0} C${m},${s0} ${m},${t0} ${x1},${t0} L${x1},${t0 + h} C${m},${t0 + h} ${m},${s0 + h} ${x0},${s0 + h} Z"/>`;
        if (l.label) s += `<text class="nv" x="${m}" y="${(s0 + t0) / 2 + h / 2 + 4}" text-anchor="middle">${esc(l.label)}</text>`;
    });
    N.forEach(n => {
        const mid = n.y + n.h / 2;
        s += `<rect class="n-${n.cls}" x="${colX[n.col]}" y="${n.y}" width="${nw}" height="${n.h}" rx="2"/>`;
        // Labels clear of the ribbons: the reference energy above its node; nodes with ribbons
        // leaving them to the left, the others to the right.
        if (n.cls === 'tgt') { s += `<text class="nl" x="${colX[1] + nw / 2}" y="${n.y - 8}" text-anchor="middle">${esc(n.label)} <tspan class="nv">${esc(n.sub)}</tspan></text>`; return; }
        const left = n.col === 0 || n.cls === 'over';
        const tx = left ? colX[n.col] - 10 : colX[n.col] + nw + 10, anchor = left ? 'end' : 'start';
        s += `<text class="nl" x="${tx}" y="${mid - 2}" text-anchor="${anchor}">${esc(n.label)}</text><text class="nv" x="${tx}" y="${mid + 13}" text-anchor="${anchor}">${esc(n.sub)}</text>`;
    });
    return s + '</svg>';
}

function drawWc() {
    const el = $('wc');
    const r = wcCompute(wcSel.day, wcSel.start);
    $('wcSource').textContent = r.source;
    const anc = r.startHour < 12 ? '01:00–04:00' : '12:00–14:00', win = r.startHour < 12 ? '06:00–10:00' : '16:00–20:00';
    // One plain sentence first: what the target is and what the event earned.
    let head;
    if (r.target == null) {
        head = r.anchorPlan === 'at most'
            ? t('head.atMost', { anc, v: fmt(r.anchorTarget), floor: fmt(r.floor), win })
            : t('head.atLeast', { anc, v: fmt(r.anchorTarget), cut: fmt(r.expectedCut) });
    } else if (r.used != null) {
        const c = curtailed(r.target, r.cappedTarget, r.used), capped = r.target - r.used > WC_CAP && r.target > r.cappedTarget;
        // The table, the chart and the ribbons hold the rest; the sentence says the result and why the limit applied.
        head = c > 0 ? t('head.curtailed', { c: fmt(c), money: dollars(c, r.day) ? ', ' + dollars(c, r.day) : '' }) +
                (capped ? ' ' + t('head.limited', { v: fmt(r.target - r.used) }) : '')
            : t('head.none', { used: fmt(r.used), target: fmt(r.target) });
    } else {
        head = t('head.plan', { target: fmt(r.target), floor: fmt(r.floor), win, cut: fmt(r.cut) }) +
            (r.advice === 'keep' ? t('head.planKeep', { v: fmt(r.keepUse) }) : '.');
    }
    const options = eventOptions(r);
    if (options && options.keep) head += ' ' + t('head.keepGain', { v: fmt(options.keep.used), gain: cash(options.keep.gain, 2), floor: fmt(r.floor) });
    if (!r.event) head = t('head.notEvent') + ' ' + head;
    const k = r.startHour < 12 ? '4/3' : '2', kWhy = t(r.startHour < 12 ? 'calc.why3' : 'calc.why2');
    const lines = [];
    // Hydro-Québec's terms, Electricity Rates article 2.59.
    lines.push(`<div>${t('calc.eventHours', { v: fmt(r.base) })}</div>`);
    lines.push(`<div>${t('calc.anchor', { anc, v: fmt(r.anchorRef) })}</div>`);
    if (r.target != null) {
        const aUsed = (r.target - r.base) / r.k + r.anchorRef;
        lines.push(`<div>${t('calc.adj', { used: fmt(aUsed), anc, ref: fmt(r.anchorRef), k, adj: fmt(r.target - r.base), why: kWhy })}</div>`);
        lines.push(`<div>${t('calc.ref', { base: fmt(r.base), adj: fmt(r.target - r.base), t: fmt(r.target) })}</div>`);
    }
    lines.push(`<div>${t('calc.limit', { ref: fmt(r.anchorRef), k, adj: fmt(r.cappedTarget - r.base), t: fmt(r.cappedTarget) })}</div>`);
    if (r.target != null) {
        if (r.used != null) {
            const c = curtailed(r.target, r.cappedTarget, r.used), capped = r.target - r.used > WC_CAP && r.target > r.cappedTarget;
            lines.push(`<div>${t('calc.cut', { used: fmt(r.used), c: fmt(c), detail: capped ? t('calc.cutDetail', { t: fmt(r.target), used: fmt(r.used), d: fmt(r.target - r.used), cap: fmt(r.cappedTarget) }) : '' })}</div>`);
        }
        lines.push(`<div>${t('calc.floor', { floor: fmt(r.floor), cut: fmt(r.cut) })}` + (r.advice === 'keep' ? t('calc.floorKeep', { v: fmt(r.keepUse) }) : '.') + '</div>');
    }
    const own = wcHours()[r.day] || {};
    let tbl = `<table><tr><th>${t('th.hour')}</th>${r.refDays.map(d => `<th>${esc(dayLabel(d))}</th>`).join('')}<th>${t('th.avg')}</th><th>${esc(dayLabel(r.day))}</th></tr>`;
    const sumOwn = rows => rows.every(x => own[x.hour] != null) ? fmt(rows.reduce((s, x) => s + own[x.hour], 0), 2) : '–';
    const block = (rows, label, total) => rows.map(x => `<tr class="${x.anchor ? 'anc' : ''}"><td>${x.hour}:00</td>` +
            x.values.map((v, i) => `<td class="${i === x.low || i === x.high ? 'drop' : ''}">${v == null ? '–' : fmt(v, 2)}</td>`).join('') +
            `<td>${fmt(x.mean, 2)}</td><td>${own[x.hour] == null ? '–' : fmt(own[x.hour], 2)}</td></tr>`).join('') +
        `<tr class="sum"><td>${label}</td>${r.refDays.map(() => '<td></td>').join('')}<td>${fmt(total, 2)}</td><td>${sumOwn(rows)}</td></tr>` + tempRow(rows);
    // The mean outdoor temperature of the block's hours, on each reference day and on the day itself.
    const tempRow = rows => {
        if (!temps) return '';
        const hrs = rows.map(x => x.hour), ts = r.refDays.map(d => tempOf(d, hrs)), known = ts.filter(v => v != null);
        return `<tr class="temp"><td>${t('term.outdoors')}</td>${ts.map(v => `<td>${deg(v)}</td>`).join('')}<td>${known.length ? deg(known.reduce((a, b) => a + b, 0) / known.length) : '–'}</td><td>${deg(tempOf(r.day, hrs))}</td></tr>`;
    };
    tbl += block(r.rows.filter(x => x.anchor), t('term.anchor'), r.anchorRef) + block(r.rows.filter(x => !x.anchor), t('term.eventHours'), r.base) + '</table>';
    const kind = t(isWeekend(r.day) ? 'how.weekend' : 'how.weekdays');
    // r.skipped holds peakTarget's own reasons, 'event' or 'no peak hours'.
    const skipped = r.skipped.length ? ' ' + t('how.skipped', { list: r.skipped.map(([d, why]) => `${dayLabel(d)} (${why === 'event' ? t('term.peakEvent') : t('tip.noPeak')})`).join(', ') }) : '';
    el.innerHTML = `<div class="headline">${head}</div>${options ? options.table : ''}${cumulative(r)}${sankey(r)}` +
        `<details class="how"${wcHowOpen ? ' open' : ''}><summary>${t('how.summary')}</summary>` +
        `<div class="calc">${lines.join('')}</div><div class="scroll">${tbl}</div>` +
        `<div class="legend wcnote">${t('how.note', { kind, skipped: esc(skipped) })}` +
        (r.missing.length ? ' ' + t('how.missing', { n: r.missing.length }) : '') + `</div></details>`;
    el.querySelector('details').ontoggle = e => wcHowOpen = e.target.open;
}

// An event's mean outdoor temperature, and the reference period's at the same hours.
function eventTemps(day, start, r) {
    const hrs = [0, 1, 2, 3].map(i => start + i), ts = (r.refDays || []).map(d => tempOf(d, hrs)).filter(v => v != null);
    return `<td>${deg(tempOf(day, hrs))}</td><td>${ts.length ? deg(ts.reduce((a, b) => a + b, 0) / ts.length) : '–'}</td>`;
}

function drawEvents() {
    const evs = seasonEvents(), scored = evs.filter(e => e.scored);
    const selKey = `${wcSel.day}|${wcSel.start}`;
    const ch = $('evchart');
    if (ch) {
        ch.innerHTML = bars(scored.map(e => ({ key: `${e.x.day}|${e.x.start}`, value: e.c, label: `${+e.x.day.slice(8)} ${monthShort(+e.x.day.slice(5, 7) - 1)} ${e.x.start < 12 ? 'AM' : 'PM'}`,
            cls: `${e.x.day}|${e.x.start}` === selKey ? 'sel' : e.capped ? 'capped' : '' })),
            { height: 200, labelEvery: Math.max(1, Math.ceil(scored.length / 14)), hline: [WC_CAP],
              fmtTip: v => { const e = scored.find(x => `${x.x.day}|${x.x.start}` === v.key); return t('tip.event', { day: dayName(e.x.day), slot: e.x.start < 12 ? 'AM' : 'PM', c: fmt(e.c), t: fmt(e.r.target), u: fmt(e.r.used), lim: e.capped ? t('tip.limited') : '' }); } });
        wire(ch, k => { const [d, h] = k.split('|'); select(d, +h); });
    }
    const el = $('evtable');
    if (!evs.length) { el.innerHTML = `<div class="legend">${events ? t('ev.none') : esc(eventNote)}</div>`; return; }
    const floor = evs[0].r.floor;
    el.innerHTML = `<table><tr><th>${t('th.event')}</th><th>${t('th.ref')}</th><th>${t('th.lim')}</th><th>${t('th.used')}</th><th>${t('opt.thCut')}</th><th>${t('th.ifCut', { v: fmt(floor) })}</th>${temps ? `<th>${t('th.outEvent')}</th><th>${t('th.outRef')}</th>` : ''}</tr>` +
        evs.slice().reverse().map(({ x, r, c, capped }) =>
            `<tr class="click${`${x.day}|${x.start}` === selKey ? ' selrow' : ''}" data-d="${x.day}" data-h="${x.start}"><td>${esc(dayName(x.day))} ${x.start < 12 ? 'AM' : 'PM'}</td><td>${fmt(r.target)}</td><td>${fmt(r.cappedTarget)}</td>` +
            `<td>${fmt(r.used)}</td><td>${fmt(c)}${capped ? ' ' + t('ev.limited') : ''}</td><td>${fmt(r.cut)}</td>` + (temps ? eventTemps(x.day, x.start, r) : '') + `</tr>`).join('') + '</table>';
    el.querySelectorAll('tr.click').forEach(row => row.onclick = () => { select(row.dataset.d, +row.dataset.h); $('dayTitle').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
}

init().catch(e => fail(t('err.read', { why: e.message })));
</script>
</body>
