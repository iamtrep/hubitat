:"hpm","location":null,"managedBy":"hpm","status":"current","ihash":"b2c3d4e5f6a1b2c3","ahash":"b2c3d4e5f6a1b2c3","iver":null,"iverSrc":null,"rhash":"b2c3d4e5f6a1b2c3","rver":null,"checkedAtMs":1787299990000,"changedAtMs":1787299989900,"httpStatus":200,"failCount":0,"error":null,"lastModifiedMs":1783300000000,"usedByCount":1,"usedBy":[{"id":102,"name":"Instance 2"}],"bundleOf":null,"isPrivate":false,"required":true},{"key":"url:https://example.org/example-repo/AppC.groovy","kind":"app","hubId":"203","namespace":"example","name":"App C","origin":"url","location":"https://example.org/example-repo/AppC.groovy","managedBy":"cm","status":"changed-upstream","ihash":"c3d4e5f6a1b2c3d4","ahash":"c3d4e5f6a1b2c3d4","iver":"0.0.1","iverSrc":"field","rhash":"d4e5f6a1b2c3d4e5","rver":"0.0.1","checkedAtMs":1787299991000,"changedAtMs":1787299980000,"httpStatus":304,"failCount":0,"error":null,"lastModifiedMs":1779300000000,"usedByCount":1,"usedBy":[{"id":203,"name":"Instance 3"}],"bundleOf":null,"isPrivate":false,"required":true},{"key":"local:library/example/Lib D","kind":"library","hubId":"304","namespace":"example","name":"Lib D","origin":"local","location":null,"managedBy":"cm","status":"unmanaged","ihash":"e5f6a1b2c3d4e5f6","ahash":"e5f6a1b2c3d4e5f6","iver":"0.0.2","iverSrc":"field","rhash":null,"rver":null,"checkedAtMs":null,"changedAtMs":null,"httpStatus":null,"failCount":0,"error":null,"lastModifiedMs":1781300000000,"usedByCount":2,"usedBy":[{"id":304,"name":"Device 4"},{"id":305,"name":"Device 5"}],"bundleOf":null,"isPrivate":false,"required":true},{"key":"bundle:1","kind":"driver","hubId":"1","namespace":"example","name":"Driver E","origin":"bundle","location":null,"managedBy":"cm","status":"current","ihash":"f6a1b2c3d4e5f6a1","ahash":"f6a1b2c3d4e5f6a1","iver":"6","iverSrc":"field","rhash":"f6a1b2c3d4e5f6a1","rver":"1.4.3","checkedAtMs":1787299990500,"changedAtMs":1787299979500,"httpStatus":304,"failCount":0,"error":null,"lastModifiedMs":1781800000000,"usedByCount":1,"usedBy":[{"name":"Instance 6"}],"bundleOf":"1","isPrivate":false,"required":true}],"summary":{"packages":4,"components":5,"byOrigin":{"hpm":2,"url":1,"local":1,"bundle":1},"byStatus":{"current":3,"changed-upstream":1,"unmanaged":1},"byKind":{"driver":2,"app":2,"library":1},"unused":0},"hpm":{"mode":"observe","instanceId":"1","importedAt":1787299910000,"autoUpdateMode":"Never","dangling":0,"typeId":"100","disabled":false,"packages":1},"drift":{"id":"drift-1787300000000-0001","kind":"drift","status":"done","total":0,"startedAt":1787299700000,"finishedAt":1787299700100},"lastInventory":{"at":1787299990000,"items":5,"fetched":0,"changed":0}},
  'hpm/status': {"mode":"observe","instanceId":"1","importedAt":1787299910000,"autoUpdateMode":"Never","dangling":0,"typeId":"100","disabled":false,"packages":1},
  'settings': {"txtEnable":true,"debugEnable":false,"traceEnable":false,"labelBadge":true,"driftMaxInflight":6,"brokenAfter":3,"appVersion":"0.1.1","uiVersion":"0.1.1"},
  'version/check': {"currentVersion":"0.1.1","latestVersion":"0.1.1","updateAvailable":false} };
const T='${access_token}', B='${api_base}', APP_VERSION='${app_version}', cache={};
// Token in the Authorization header, not the URL — keeps it out of hub and proxy
// access logs. The platform matches the scheme case-sensitively: exactly "Bearer".
const AUTH=(x)=>Object.assign({'Authorization':'Bearer '+T},x||{});
const HUB_ORIGIN=(B.match(/^(https?:\/\/[^\/]+)\/apps\/api\//)||[])[1]||'';
(function(){ const m=B.match(/^(https?:\/\/[^\/]+)\/apps\/api\/(\d+)/); const el=document.getElementById('cfgLink'); if(m&&el)el.href=m[1]+'/installedapp/configure/'+m[2]; else if(el)el.style.display='none'; })();
let curTab = localStorage.getItem('cm_tab') || 'inventory';
const README = 'https://github.com/iamtrep/hubitat/tree/main/apps/CodeManager#';

// ===== API: 2-minute cache, mutation-driven drop, in-flight dedup, 3-wide semaphore =====
const CACHE_TTL_MS=120000, inFlight={};
function makeLimiter(n){let active=0;const q=[];function next(){if(active>=n||!q.length)return;active++;const {fn,res,rej}=q.shift();Promise.resolve().then(fn).then(v=>{active--;res(v);next()},e=>{active--;rej(e);next()})}return{run(fn){return new Promise((res,rej)=>{q.push({fn,res,rej});next()})}}}
const hubLimiter = makeLimiter(3);
async function api(ep){
  if(WORKBENCH&&MOCK_DATA[ep])return MOCK_DATA[ep];
  const hit=cache[ep];if(hit&&(Date.now()-hit.ts<CACHE_TTL_MS))return hit.d;
  if(inFlight[ep])return inFlight[ep];
  inFlight[ep]=hubLimiter.run(async()=>{const r=await fetch(B+'/api/'+ep,{headers:AUTH()});if(!r.ok)throw new Error('API '+r.status);return r.json()})
    .then(d=>{cache[ep]={d,ts:Date.now()};return d}).finally(()=>{delete inFlight[ep]});
  return inFlight[ep];
}
async function post(ep,p){if(WORKBENCH)return{success:true};const q=new URLSearchParams(p||{});const qs=q.toString();return hubLimiter.run(async()=>{const r=await fetch(B+'/api/'+ep+(qs?'?'+qs:''),{method:'POST',headers:AUTH()});if(!r.ok)throw new Error('API '+r.status);return r.json()})}
function drop(ep){if(ep)delete cache[ep];else Object.keys(cache).forEach(k=>delete cache[k])}

// ===== Pure helpers (extracted by tests/*.js — keep dependency-free) =====
function escText(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function h(s){return escText(s)}
function safeHref(u){if(typeof u!=='string')return '';if(!/^https:\/\/[A-Za-z0-9.\-]+(?::\d+)?\/[^\s"'<>\\]*$/.test(u))return '';return u}
function csvCell(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)||s.startsWith("'")?'"'+s.replace(/"/g,'""')+'"':s}
function fmtDays(ms,now){if(!ms)return{text:'Never',color:'var(--muted)'};const d=Math.floor(((now||Date.now())-ms)/86400000);return{text:d+'d',color:d>=14?'var(--crit)':d>=7?'var(--warn)':'var(--ok)'}}
function classifyComponent(c){const s=c.status||'not-checked';const map={'current':['Current','var(--ok)'],'update-available':['Update available','var(--warn)'],'changed-upstream':['Changed upstream','var(--warn)'],'modified-locally':['Modified locally','var(--warn)'],'broken-source':['Broken source','var(--crit)'],'incomplete':['Incomplete','var(--crit)'],'missing':['Missing on hub','var(--crit)'],'not-installed':['Not installed','var(--muted)'],'private':['Private bundle','var(--muted)'],'unmanaged':['No upstream','var(--muted)'],'not-checked':['Not checked','var(--muted)']};const m=map[s]||[s,'var(--muted)'];return{origin:c.origin,status:s,label:m[0],color:m[1]}}
const STATUS_HELP={'current':'installed source matches upstream','update-available':'upstream version is higher','changed-upstream':'upstream file differs but the versions do not order','modified-locally':'edited on the hub since Code Manager first saw it','broken-source':'the upstream URL answered 404/410 on three checks running','incomplete':'a required component of this package is not on the hub','missing':'required by the package, not installed','not-installed':'optional component the package never installed','private':'private code — the source is never read','unmanaged':'no import URL, so there is nothing to compare against','not-checked':'no drift check has compared this code with its upstream yet, or the code changed since'};
function legend(keys){return '<div class="legend">'+keys.map(k=>{const c=classifyComponent({status:k});return '<div>'+badge(c.label,c.color)+' '+h(STATUS_HELP[k]||'')+'</div>'}).join('')+'</div>'}
// Removability is per package (DESIGN.md §3): zero usage, no used bundle sibling, not referenced as a child type by an installed parent.
function safeToRemove(c,comps){if(!c.hubId)return false;if((c.usedByCount||0)>0)return false;if(c.bundleOf){if(comps.some(o=>o.bundleOf===c.bundleOf&&(o.usedByCount||0)>0))return false}return true}

// ===== UI primitives =====
// File Manager entries are served at /local/<name>; every other kind opens in its code editor.
function clink(kind,id,n){const p={app:'/app/editor/',driver:'/driver/editor/',library:'/library/editor/',bundle:'/bundle/editor/',file:'/local/'}[kind];return p&&id?'<a href="'+p+encodeURIComponent(id)+'" target="_blank">'+h(n)+'</a>':h(n)}
function dlistlink(count,ids){if(!ids||!ids.length)return String(count??0);return'<a href="/device/list?ids='+ids.map(Number).join(',')+'" target="_blank">'+count+'</a>'}
function alistlink(count){return'<a href="/installedapp/list" target="_blank">'+(count??0)+'</a>'}
function badge(label,color){const cls=color==='var(--ok)'?'b-ok':color==='var(--warn)'?'b-warn':color==='var(--crit)'?'b-crit':'b-muted';return'<span class="badge '+cls+'">'+h(label)+'</span>'}
function mc(l,v,c){return'<div class="m"><div class="l">'+h(l)+'</div><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div></div>'}
function loading(id){document.getElementById(id).innerHTML='<div class="loading">Loading...</div>'}
function err(id,e,fn){document.getElementById(id).innerHTML='<div class="err"><div>'+h(e.message||String(e))+'</div><button class="btn" onclick="('+fn.name+')()">Retry</button></div>'}
function flash(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;setTimeout(()=>{if(el.textContent===msg)el.textContent=''},4000)}}
function dlink2(u){const s=safeHref(u);return s?'<a href="'+h(s)+'" target="_blank">'+h(s.replace(/^https:\/\/raw\.githubusercontent\.com\//,''))+'</a>':(u?h(u):'')}

// ===== SORTABLE TABLE ENGINE (copied verbatim from apps/HubDiagnostics/hub_diagnostics_ui.html) =====
function tbl(cid,cols,rows,opts={}){
  const el=document.getElementById(cid);if(!el)return;
  if(!rows||!rows.length){el.innerHTML='<p style="color:var(--muted);padding:16px">No data</p>';return}
  let filt=[...rows],sc=opts.sc??0,sd=opts.sd??'asc';
  const ct=opts.collapse??0,cl=opts.collapseLabel;
  // Filter/sort compare against each cell's *visible* text so they match what the user sees —
  // the alias when name obfuscation is on (renderers already apply Obf.nm), the real name when
  // off. Memoized once per build (toggling obfuscation clears panels and rebuilds the table), so
  // the debounced filter and the sort comparator never re-parse HTML per keystroke.
  const _ctCache=new Map();
  function cellText(c,ci,r){
    let arr=_ctCache.get(r);if(!arr){arr=[];_ctCache.set(r,arr)}
    if(arr[ci]!==undefined)return arr[ci];
    let t;
    if(c.ff)t=String(c.ff(r)??'');                                                                    // explicit override wins
    else if(c.r){const tmp=document.createElement('div');tmp.innerHTML=c.r(r);t=tmp.textContent||''}  // rendered text: tags stripped, entities decoded
    else t=String(r[c.f]??'');                                                                        // plain field
    return arr[ci]=t;
  }
  function sf(r,ci,d){const c=cols[ci],num=c.t==='n';
    return r.map(row=>({row,k:num?(parseFloat(row[c.sf]??row[c.f])||0):cellText(c,ci,row).toLowerCase()}))
      .sort((a,b)=>{if(a.k<b.k)return d==='asc'?-1:1;if(a.k>b.k)return d==='asc'?1:-1;return 0})
      .map(o=>o.row)}
  function bld(rs){
    let o='';
    if(opts.filter)o+='<div class="filter"><input type="text" placeholder="Filter..." id="flt_'+cid+'"></div>';
    if(ct>0&&cl){const open=rows.length<=ct?' open':'';o+='<details'+open+'><summary style="cursor:pointer;font-weight:600;margin:4px 0">'+cl+' ('+rows.length+')</summary>'}
    o+='<div class="tbl-wrap"><table id="t_'+cid+'"><thead><tr>';
    cols.forEach((c,i)=>{const ar=i===sc?(sd==='asc'?' ▲':' ▼'):' ⇅';o+='<th data-c="'+i+'">'+h(c.l)+'<span class="arr">'+ar+'</span></th>'});
    o+='</tr></thead><tbody>'+bldRows(rs)+'</tbody></table></div>';
    if(ct>0&&cl)o+='</details>';return o
  }
  function bldRows(rs){
    let o='';
    rs.forEach(r=>{
      o+='<tr>';
      cols.forEach((c,ci)=>{
        const v=c.r?c.r(r):h(r[c.f]??'');
        const sv=cellText(c,ci,r);   // data-v mirrors visible text → no real-name leak into copied/exported HTML
        const color = r['_' + c.f + 'Color'] || '';
        const style = color ? ' style="color:' + color + ';font-weight:600"' : '';
        o+='<td data-v="'+h(String(sv))+'"'+style+'>'+v+'</td>'
      });
      o+='</tr>'
    });
    return o;
  }
  filt=sf(filt,sc,sd);el.innerHTML=bld(filt);
  function bind(){
    const t=document.getElementById('t_'+cid);if(!t)return;
    // v5.18.0 (R-5 A10): on header click, only re-render <tbody> rows + update sort arrows in
    // the existing <th> cells. Pre-fix the entire table was rebuilt via el.innerHTML and bind()
    // was re-run, throwing away the click handlers, the filter input (and its focus), and any
    // <details> open state. New path is faster on large tables (350-row per-device audit table)
    // and preserves filter focus / details state automatically.
    t.querySelectorAll('th').forEach(th=>{th.onclick=()=>{
      const ci=+th.dataset.c;
      if(ci===sc)sd=sd==='asc'?'desc':'asc';else{sc=ci;sd='desc'};
      filt=sf(filt,sc,sd);
      const tb=t.querySelector('tbody');
      if(tb){
        tb.innerHTML=bldRows(filt);
        // Refresh sort-arrow indicators across all th cells
        t.querySelectorAll('th').forEach((thh,i)=>{
          const arr=thh.querySelector('.arr');
          if(arr)arr.textContent=i===sc?(sd==='asc'?' ▲':' ▼'):' ⇅';
        });
      } else {
        // Fallback: full rebuild if tbody is somehow missing
        const det=el.querySelector('details');const wasOpen=det?det.open:false;
        el.innerHTML=bld(filt);
        const det2=el.querySelector('details');if(det2)det2.open=wasOpen;
        bind();
      }
    }});
    const fi=document.getElementById('flt_'+cid);
    if(fi){
      // v5.19.0 (R-6 B4): 150ms debounce — pre-fix every keystroke triggered full filter+sort+innerHTML
      // rewrite, painful on 200+ row tables. Debounce coalesces typing bursts into one render.
      let _fltTimer=null;
      fi.addEventListener('input',()=>{
        clearTimeout(_fltTimer);
        _fltTimer=setTimeout(()=>{
          const q=fi.value.toLowerCase();
          // Full-text match across each column's visible text (see cellText): the displayed
          // alias when name obfuscation is on, the real name when off.
          filt=rows.filter(r=>cols.some((c,ci)=>cellText(c,ci,r).toLowerCase().includes(q)));
          filt=sf(filt,sc,sd);
          const tb=t.querySelector('tbody');
          if(tb) tb.innerHTML=bldRows(filt);
          else { el.innerHTML=bld(filt);bind() }
        },150);
      });
    }
  }bind()
}

// ===== Jobs: pollTimers registry, 2 s tick, 5 min cap, terminal 'done' =====
const pollTimers={};
function pollJob(jobId,onTick,onEnd){if(pollTimers[jobId])return;const t0=Date.now();pollTimers[jobId]=setInterval(async()=>{try{const j=await fetch(B+'/api/jobs/'+jobId,{headers:AUTH()}).then(r=>r.json());onTick(j);if(j.status!=='running'){clearInterval(pollTimers[jobId]);delete pollTimers[jobId];onEnd(j)}}catch(e){}if(Date.now()-t0>300000){clearInterval(pollTimers[jobId]);delete pollTimers[jobId];onEnd({status:'timeout'})}},2000)}

// ===== Tabs =====
async function rInventory(){
  const P='p-inventory';loading(P);
  try{
    const d=await api('inventory');const comps=d.components||[];const now=Date.now();
    document.getElementById('hubInfo').textContent=(d.hub&&d.hub.name?d.hub.name+' · '+d.hub.firmware+' · ':'')+'App v'+d.appVersion+' / UI v'+CODE_VERSION;
    const s=d.summary||{};const st=s.byStatus||{};
    let html='<div class="card"><div class="card-h">Summary <span class="msg"><a href="'+README+'freshness" target="_blank">how freshness is decided</a></span></div><div class="card-b"><div class="metrics">'
      +mc('Components',s.components||0)+mc('Packages',s.packages||0)+mc('Updates available',st['update-available']||0,st['update-available']?'var(--warn)':'')
      +mc('Changed upstream',st['changed-upstream']||0)+mc('Broken sources',st['broken-source']||0,st['broken-source']?'var(--crit)':'')+mc('Unused',s.unused||0)+'</div>'
      +'<div class="actions"><button class="btn btn-p" id="driftBtn" onclick="startDrift()">Check for drift now</button><span class="msg" id="driftMsg">'+(d.drift&&d.drift.finishedAt?'Last drift check '+new Date(d.drift.finishedAt).toLocaleString():'No drift check yet')+'</span></div></div></div>';
    html+='<div class="card"><div class="card-h">Components <span class="msg"><label><input type="checkbox" id="onlyRemovable" onchange="rInventoryTable()"> safe to remove only (<a href="'+README+'safe-to-remove" target="_blank">rule</a>)</label></span></div><div class="card-b"><div id="invTbl"></div>'
      +legend(['current','update-available','changed-upstream','modified-locally','broken-source','missing','not-installed','unmanaged','private','not-checked'])+'</div></div>';
    document.getElementById(P).innerHTML=html;window._inv=comps;rInventoryTable();
  }catch(e){err(P,e,rInventory)}
}
function rInventoryTable(){
  const comps=window._inv||[];const only=document.getElementById('onlyRemovable')?.checked;const now=Date.now();
  const rows=(only?comps.filter(c=>safeToRemove(c,comps)):comps).map(c=>Object.assign({},c,{_cls:classifyComponent(c),_rem:safeToRemove(c,comps)}));
  tbl('invTbl',[
    {l:'Name',f:'name',r:r=>clink(r.kind,r.hubId,r.name)+(r.isPrivate?' '+badge('private','var(--muted)'):'')},
    {l:'Kind',f:'kind'},{l:'Namespace',f:'namespace'},{l:'Origin',f:'origin'},
    {l:'Status',f:'status',r:r=>badge(r._cls.label,r._cls.color),ff:r=>r._cls.label},
    {l:'Installed',f:'iver',r:r=>h(r.iver||'')+(r.iverSrc&&r.iverSrc!=='field'&&r.iverSrc!=='manifest'?' <span class="msg">('+h(r.iverSrc)+')</span>':'')},
    {l:'Upstream',f:'rver'},
    {l:'Used by',f:'usedByCount',t:'n',r:r=>r.kind==='driver'?dlistlink(r.usedByCount,(r.usedBy||[]).map(u=>u.id)):r.kind==='app'?alistlink(r.usedByCount):String(r.usedByCount)},
    {l:'Checked',f:'checkedAtMs',t:'n',r:r=>{const f=fmtDays(r.checkedAtMs,now);return'<span style="color:'+f.color+'">'+f.text+'</span>'}},
    {l:'Source',f:'location',r:r=>dlink2(r.location)},
    {l:'Removable',f:'_rem',r:r=>r._rem?badge('yes','var(--ok)'):''},
  ],rows,{sc:4,sd:'desc',filter:true});
}
// Every item on the hub belongs to exactly one package, but most hand-installed code is a package of
// one — listing those beside real multi-file packages buries them, so they get their own collapsed table.
function isMultiPackage(p){return p.origin==='hpm'||p.origin==='bundle'||(p.componentCount||0)>1}
async function rPackages(){
  const P='p-packages';loading(P);
  try{const d=await api('inventory');const pk=d.packages||[];
    const multi=pk.filter(isMultiPackage), solo=pk.filter(p=>!isMultiPackage(p));
    const stat=r=>{const c=classifyComponent(r);return badge(c.label,c.color)};
    const doc=r=>r.doc?'<a href="/hub/fileManager" target="_blank">'+h(r.doc)+'</a>':'';
    document.getElementById(P).innerHTML=
      '<div class="card"><div class="card-h">Packages <span class="msg">HPM packages and bundles — code installed and updated as a set (<a href="'+README+'packages" target="_blank">how ownership is decided</a>)</span></div>'
      +'<div class="card-b"><div id="pkgTbl"></div>'+legend(['current','update-available','changed-upstream','incomplete','broken-source','not-checked'])+'</div></div>'
      +'<div class="card"><div class="card-h">Standalone code <span class="msg">one file each: imported from a URL, or written on the hub. Listed here so every item has exactly one owner.</span></div>'
      +'<div class="card-b"><div id="soloTbl"></div>'+legend(['current','update-available','changed-upstream','modified-locally','broken-source','unmanaged','not-checked'])+'</div></div>';
    tbl('pkgTbl',[{l:'Package',f:'name'},{l:'Origin',f:'origin'},{l:'Version',f:'version'},{l:'Components',f:'componentCount',t:'n'},
      {l:'Status',f:'status',r:stat},{l:'Document',f:'doc',r:doc},
      {l:'Source',f:'url',r:r=>dlink2(r.url||(r.origin==='hpm'?r.key:''))}],multi,{sc:0,filter:true});
    tbl('soloTbl',[{l:'Name',f:'name'},{l:'Kind',f:'kind'},{l:'Status',f:'status',r:stat},
      {l:'Source',f:'url',r:r=>dlink2(r.origin==='url'?r.key.slice(4):'')},{l:'Document',f:'doc',r:doc}],
      solo,{sc:0,filter:true,collapse:1,collapseLabel:'Standalone code'});
  }catch(e){err(P,e,rPackages)}
}
async function rHpm(){
  const P='p-hpm';loading(P);
  try{const s=await api('hpm/status');let html='<div class="card"><div class="card-h">Hubitat Package Manager transition <span class="msg"><a href="'+README+'hpm-observe" target="_blank">how the phases work</a></span></div><div class="card-b">';
    if(s.mode==='absent')html+='<div class="alert a-info">HPM is not installed. Code Manager is the only package manager on this hub.</div>';
    else{html+='<div class="alert a-warn"><b>Mode: '+h(s.mode)+'</b> — HPM instance '+h(String(s.instanceId))+' is '+(s.disabled?'disabled':'enabled')+'; autoUpdateMode='+h(String(s.autoUpdateMode))+'. In observe mode HPM remains the writer for its packages; Code Manager only reports.</div>'
      +'<div class="metrics">'+mc('Imported packages',s.packages||0)+mc('Dangling heIDs',s.dangling||0,s.dangling?'var(--warn)':'')+mc('Last import',s.importedAt?new Date(s.importedAt).toLocaleString():'never')+'</div>'
      +'<div class="actions"><button class="btn" id="hpmBtn" onclick="hpmImport()">Re-import HPM registry</button><span class="msg" id="hpmMsg"></span></div>'}
    document.getElementById(P).innerHTML=html+'</div></div>';
  }catch(e){err(P,e,rHpm)}
}
async function hpmImport(){const b=document.getElementById('hpmBtn');b.disabled=true;b.textContent='Importing…';try{const r=await post('hpm/import');flash('hpmMsg',r.success?'Imported '+r.packages+' packages ('+r.dangling+' dangling)':'Failed: '+(r.error||''));drop('inventory');drop('hpm/status')}catch(e){flash('hpmMsg','Failed: '+e.message)}finally{b.disabled=false;b.textContent='Re-import HPM registry';rHpm()}}
async function startDrift(){const b=document.getElementById('driftBtn');b.disabled=true;b.textContent='Checking…';
  try{const r=await post('drift/start',{scope:'all'});if(r.error)throw new Error(r.error);pollJob(r.jobId,j=>{document.getElementById('driftMsg').textContent=(j.processed||0)+' / '+(j.total||0)},j=>{drop('inventory');b.disabled=false;b.textContent='Check for drift now';const q=j.result||{};flash('driftMsg',j.status==='done'?'Done: '+(q.checked||0)+' checked, '+(q.failed||0)+' failed, '+(q.skippedLarge||0)+' too large':'Drift check '+j.status+(j.error?': '+j.error:''));rInventory()})}
  catch(e){b.disabled=false;b.textContent='Check for drift now';flash('driftMsg','Failed: '+e.message)}}
async function rSettings(){
  const P='p-settings';loading(P);
  try{const [s,v]=await Promise.all([api('settings'),api('version/check').catch(()=>({}))]);
    const mismatch=APP_VERSION[0]!=='$'&&APP_VERSION!==CODE_VERSION;
    let html='<div class="card"><div class="card-h">Versions</div><div class="card-b">'+(mismatch?'<div class="alert a-warn">App v'+h(APP_VERSION)+' and UI v'+CODE_VERSION+' differ — <button class="btn" onclick="syncUI()">Sync UI from GitHub</button></div>':'')
      +'<div class="metrics">'+mc('App',h(s.appVersion||APP_VERSION))+mc('UI',CODE_VERSION)+mc('Latest on GitHub',h(v.latestVersion||'?'),v.updateAvailable?'var(--warn)':'')+'</div>'
      +(v.updateAvailable?'<p class="msg">A newer Code Manager is published'+(v.editorPath?': <a href="'+h(v.editorPath)+'" target="_blank">open Apps Code</a> and use Import.':'.')+'</p>':'')+'</div></div>';
    html+='<div class="card"><div class="card-h">Behaviour (fixed values, <a href="'+README+'fixed-values" target="_blank">documented</a>)</div><div class="card-b"><div class="metrics">'+mc('Upstream fetches in flight',s.driftMaxInflight)+mc('Broken after',s.brokenAfter+' failures')+'</div></div></div>';
    html+='<div class="card"><div class="card-h">Settings</div><div class="card-b">'+['txtEnable','debugEnable','traceEnable','labelBadge'].map(k=>'<label style="display:block;margin:4px 0"><input type="checkbox" id="set_'+k+'"'+(s[k]?' checked':'')+'> '+k+'</label>').join('')
      +'<div class="actions"><button class="btn btn-p" onclick="saveSettings()">Save</button><span class="msg" id="setMsg"></span></div></div></div>';
    html+='<div class="card"><div class="card-h">Export</div><div class="card-b"><div class="actions"><button class="btn" onclick="exportRegistry()">Write cm_registry_export.json</button><span class="msg" id="expMsg"></span></div></div></div>';
    document.getElementById(P).innerHTML=html;
  }catch(e){err(P,e,rSettings)}
}
async function saveSettings(){const body={};['txtEnable','debugEnable','traceEnable','labelBadge'].forEach(k=>body[k]=document.getElementById('set_'+k).checked);try{const r=await post('settings',{data:JSON.stringify(body)});flash('setMsg',r.success?'Saved':'Failed');drop('settings')}catch(e){flash('setMsg','Failed: '+e.message)}}
async function syncUI(){try{const r=await post('ui/sync');if(r.success)location.reload();else flash('setMsg','Sync refused (version mismatch on GitHub?)')}catch(e){flash('setMsg','Failed: '+e.message)}}
async function exportRegistry(){try{await api('export?'+Date.now());flash('expMsg','Written to File Manager')}catch(e){flash('expMsg','Failed: '+e.message)}}

// ===== Router =====
const R={inventory:rInventory,packages:rPackages,hpm:rHpm,settings:rSettings};
function go(t){curTab=t;localStorage.setItem('cm_tab',t);document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));const p=document.getElementById('p-'+t);if(!p.children.length||p.querySelector('.loading')||p.querySelector('.err'))R[t]()}
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.dataset.tab)go(e.target.dataset.tab)});
function refreshPage(){const keys={inventory:['inventory'],packages:['inventory'],hpm:['hpm/status','inventory'],settings:['settings','version/check']};(keys[curTab]||[]).forEach(k=>drop(k));document.getElementById('p-'+curTab).innerHTML='';R[curTab]()}
go(curTab);
</script>
</body>
</html>
