// ===== API: 2-minute cache, mutation-driven drop, in-flight dedup, 3-wide semaphore =====
const CACHE_TTL_MS=120000, inFlight={};
function makeLimiter(n){let active=0;const q=[];function next(){if(active>=n||!q.length)return;active++;const {fn,res,rej}=q.shift();Promise.resolve().then(fn).then(v=>{active--;res(v);next()},e=>{active--;rej(e);next()})}return{run(fn){return new Promise((res,rej)=>{q.push({fn,res,rej});next()})}}}

async function api(ep){

    .then(d=>{cache[ep]={d,ts:Date.now()};return d}).finally(()=>{delete inFlight[ep]});

}

// ===== Pure helpers (extracted by tests/*.js — keep dependency-free) =====
function escText(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function fmtDate(ms){if(!ms)return'never';const d=new Date(ms);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}

// Version order of the app's compareVersions (DESIGN.md §4): numeric segments, a leading v and a trailing tag ignored; null when unparsable.
function versionParts(v){if(!v)return null;let s=String(v).trim().replace(/^[vV]/,'');s=s.split(' ')[0].split('(')[0];if(!s)return null;const out=[];for(const seg of s.split(/[.\-]/)){const dg=seg.replace(/[A-Za-z]+$/,'');if(!/^\d+$/.test(dg))return null;out.push(+dg)}return out}
function versionCompare(a,b){const pa=versionParts(a),pb=versionParts(b);if(!pa||!pb)return null;for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=pa[i]||0,y=pb[i]||0;if(x!==y)return x<y?-1:1}return 0}

function versionSort(a,b){const c=versionCompare(a,b);if(c!==null)return c;const pa=versionParts(a),pb=versionParts(b);if(pa&&!pb)return -1;if(!pa&&pb)return 1;return String(a??'').localeCompare(String(b??''))}
// Source link text: host and path, no scheme; the full URL goes in the title.
function srcText(u){return String(u||'').replace(/^https?:\/\//,'').replace(/^raw\.githubusercontent\.com\//,'github/')}
function classifyComponent(c){const s=c.status||'not-checked';const map={'current':['Current','var(--ok)'],'update-available':['Update available','var(--warn)'],'changed-upstream':['Changed upstream','var(--warn)'],'modified-locally':['Modified locally','var(--warn)'],'broken-source':['Broken source','var(--crit)'],'incomplete':['Incomplete','var(--crit)'],'missing':['Missing on hub','var(--crit)'],'not-installed':['Not installed','var(--muted)'],'private':['Private bundle','var(--muted)'],'unmanaged':['No upstream','var(--muted)'],'not-checked':['Not checked','var(--muted)']};const m=map[s]||[s,'var(--muted)'];return{origin:c.origin,status:s,label:m[0],color:m[1]}}
const STATUS_HELP={'current':'installed source matches upstream','update-available':'upstream version is higher','changed-upstream':'upstream file differs but the versions do not order','modified-locally':'edited on the hub since Code Manager first saw it','broken-source':'the upstream URL answered 404/410 on 3 or more checks in a row; the row shows how many','incomplete':'a required component of this package is not on the hub','missing':'required by the package, not installed','not-installed':'optional component the package never installed','private':'private code — the source is never read','unmanaged':'no import URL, so there is nothing to compare against','not-checked':'no drift check has compared this code with its upstream yet, or the code changed since'};

// Every item on the hub belongs to exactly one package; the Packages tab lists the ones installed and updated as a set.
function isMultiPackage(p){return p.origin==='hpm'||p.origin==='bundle'||(p.componentCount||0)>1}
function clink(kind,id,n){const p={app:'/app/editor/',driver:'/driver/editor/',library:'/library/editor/',bundle:'/bundle/editor/',file:'/local/'}[kind];return p&&id?'<a href="'+p+encodeURIComponent(id)+'" target="_blank">'+h(n)+'</a>':h(n)}
function dlistlink(count,ids){if(!ids||!ids.length)return String(count??0);return'<a href="/device/list?ids='+ids.map(Number).join(',')+'" target="_blank">'+count+'</a>'}
// An app's "Used by": 0 is plain, one instance links to it, several to the app list.
function alistlink(count,ids){if(!count)return'0';if(ids&&ids.length===1&&ids[0]!=null)return'<a href="/installedapp/configure/'+encodeURIComponent(ids[0])+'" target="_blank">1</a>';return'<a href="/installedapp/list" target="_blank">'+count+'</a>'}
function badge(label,color){const cls=color==='var(--ok)'?'b-ok':color==='var(--warn)'?'b-warn':color==='var(--crit)'?'b-crit':'b-muted';return'<span class="badge '+cls+'">'+h(label)+'</span>'}
function mc(l,v,c){return'<div class="m"><div class="l">'+h(l)+'</div><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div></div>'}
function loading(id){document.getElementById(id).innerHTML='<div class="loading">Loading...</div>'}
function err(id,e,tab){document.getElementById(id).innerHTML='<div class="err"><div>'+h(e.message||String(e))+'</div><button class="btn" data-action="retry" data-tab="'+h(tab)+'">Retry</button></div>'}
function flash(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;setTimeout(()=>{if(el.textContent===msg)el.textContent=''},4000)}}
function dlink2(u){const s=safeHref(u);return s?'<a class="src" href="'+h(s)+'" title="'+h(s)+'" target="_blank">'+h(srcText(s))+'</a>':(u?'<span class="src" title="'+h(u)+'">'+h(u)+'</span>':'')}

// ===== SORTABLE TABLE ENGINE (from apps/HubDiagnostics/hub_diagnostics_ui.html; keyboard sort, empty states and a row cap added) =====
// cols: {l,f, r: render, ff: filter/sort text, t:'n' with optional sf numeric field, cmp: row comparator}. opts: sc, sd, filter, collapse,
// collapseLabel, empty (message when there are no rows), label (aria-label for the filter).
function tbl(cid,cols,rows,opts={}){
  const el=document.getElementById(cid);if(!el)return;
  if(!rows||!rows.length){el.innerHTML='<p class="empty">'+h(opts.empty||'Nothing to show.')+'</p>';return}
  let filt=[...rows],sc=opts.sc??0,sd=opts.sd??'asc',all=false;
  const ct=opts.collapse??0,cl=opts.collapseLabel;
  // Filter/sort compare against each cell's visible text, memoized once per build.
  const _ctCache=new Map();
  function cellText(c,ci,r){
    let arr=_ctCache.get(r);if(!arr){arr=[];_ctCache.set(r,arr)}
    if(arr[ci]!==undefined)return arr[ci];
    let t;
    if(c.ff)t=String(c.ff(r)??'');
    else if(c.r){const tmp=document.createElement('div');tmp.innerHTML=c.r(r);t=tmp.textContent||''}
    else t=String(r[c.f]??'');
    return arr[ci]=t;
  }
  function sf(r,ci,d){const c=cols[ci],num=c.t==='n',dir=d==='asc'?1:-1;
    if(c.cmp)return [...r].sort((a,b)=>dir*c.cmp(a,b));
    return r.map(row=>({row,k:num?(parseFloat(row[c.sf]??row[c.f])||0):cellText(c,ci,row).toLowerCase()}))
      .sort((a,b)=>{if(a.k<b.k)return -dir;if(a.k>b.k)return dir;return 0})
      .map(o=>o.row)}
  function ariaSort(i){return i===sc?(sd==='asc'?'ascending':'descending'):'none'}
  function bld(rs){
    let o='';
    if(opts.filter)o+='<div class="filter"><input type="text" placeholder="Filter..." aria-label="'+h(opts.label||'Filter rows')+'" id="flt_'+cid+'"></div>';
    if(ct>0&&cl){const open=rows.length<=ct?' open':'';o+='<details'+open+'><summary style="cursor:pointer;font-weight:600;margin:4px 0">'+h(cl)+' ('+rows.length+')</summary>'}
    o+='<div class="tbl-wrap"><table id="t_'+cid+'"><thead><tr>';
    cols.forEach((c,i)=>{const ar=i===sc?(sd==='asc'?' ▲':' ▼'):' ⇅';o+='<th data-c="'+i+'" tabindex="0" aria-sort="'+ariaSort(i)+'">'+h(c.l)+'<span class="arr" aria-hidden="true">'+ar+'</span></th>'});
    o+='</tr></thead><tbody>'+bldRows(rs)+'</tbody></table></div><div id="more_'+cid+'">'+moreHtml(rs)+'</div>';
    if(ct>0&&cl)o+='</details>';return o
  }
  function moreHtml(rs){return!all&&rs.length>ROW_CAP?'<p class="msg" style="margin-top:6px">Showing '+ROW_CAP+' of '+rs.length+' rows. <button class="btn" id="all_'+cid+'">Show all</button></p>':''}
  function bldRows(rs){
    if(!rs.length)return'<tr><td colspan="'+cols.length+'" class="empty">No row matches the filter.</td></tr>';
    let o='';
    (all?rs:rs.slice(0,ROW_CAP)).forEach(r=>{
      o+='<tr>';
      cols.forEach((c,ci)=>{
        const v=c.r?c.r(r):h(r[c.f]??'');
        const sv=cellText(c,ci,r);
        o+='<td data-v="'+h(String(sv))+'">'+v+'</td>'
      });
      o+='</tr>'
    });
    return o;
  }
  filt=sf(filt,sc,sd);el.innerHTML=bld(filt);
  function redraw(t){const tb=t.querySelector('tbody');if(tb)tb.innerHTML=bldRows(filt);const m=document.getElementById('more_'+cid);if(m){m.innerHTML=moreHtml(filt);bindMore(t)}}
  function bindMore(t){const b=document.getElementById('all_'+cid);if(b)b.onclick=()=>{all=true;redraw(t)}}
  function bind(){
    const t=document.getElementById('t_'+cid);if(!t)return;
    const sortBy=th=>{
      const ci=+th.dataset.c;
      if(ci===sc)sd=sd==='asc'?'desc':'asc';else{sc=ci;sd='desc'};
      filt=sf(filt,sc,sd);redraw(t);
      t.querySelectorAll('th').forEach((thh,i)=>{const arr=thh.querySelector('.arr');if(arr)arr.textContent=i===sc?(sd==='asc'?' ▲':' ▼'):' ⇅';thh.setAttribute('aria-sort',ariaSort(i))});
    };
    t.querySelectorAll('th').forEach(th=>{th.onclick=()=>sortBy(th);th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sortBy(th)}}});
    bindMore(t);
    const fi=document.getElementById('flt_'+cid);
    if(fi){
      let _fltTimer=null;
      fi.addEventListener('input',()=>{
        clearTimeout(_fltTimer);
        _fltTimer=setTimeout(()=>{
          const q=fi.value.toLowerCase();
          filt=rows.filter(r=>cols.some((c,ci)=>cellText(c,ci,r).toLowerCase().includes(q)));
          filt=sf(filt,sc,sd);redraw(t);
        },150);
      });
    }
  }bind()
}

// ===== Jobs: pollTimers registry, 2 s tick, 30 min cap, terminal 'done'; 3 failed polls in a row end the wait =====
const pollTimers={};
function pollJob(jobId,onTick,onEnd){if(pollTimers[jobId])return;const t0=Date.now();let fails=0;
  const stop=j=>{clearInterval(pollTimers[jobId]);delete pollTimers[jobId];onEnd(j)};
  pollTimers[jobId]=setInterval(async()=>{
    try{const r=await fetch(B+'/api/jobs/'+jobId,{headers:AUTH()});if(!r.ok)throw new Error('API '+r.status);const j=await r.json();fails=0;onTick(j);if(j.status!=='running'){stop(j);return}}
    catch(e){if(++fails>=3){stop({status:'error',error:'lost contact with the hub ('+e.message+')'});return}}
    if(Date.now()-t0>1800000)stop({status:'timeout'})},2000)}

async function rInventory(){
  const P='p-inventory';loading(P);
  try{
    const d=await api('inventory');setHeader(d);const comps=d.components||[];
    const inst=comps.filter(c=>c.hubId!=null);const st={};inst.forEach(c=>st[c.status]=(st[c.status]||0)+1);
    const unused=inst.filter(c=>removeState(c,comps)==='no-current-use').length;
    const f=d.facts||{},lib=d.libraries||{};
    const libTxt=lib.asOf?'Libraries as of '+fmtDate(lib.asOf):'Libraries not read yet';
    let html='<div class="card"><div class="card-h">Summary <span class="msg"><a href="'+README+'freshness" target="_blank">how freshness is decided</a></span></div><div class="card-b"><div class="metrics">'
      +mc('Installed components',inst.length)+mc('Packages',(d.packages||[]).filter(isMultiPackage).length)+mc('Updates available',st['update-available']||0,st['update-available']?'var(--warn)':'')
      +mc('Changed upstream',st['changed-upstream']||0)+mc('Broken sources',st['broken-source']||0,st['broken-source']?'var(--crit)':'')+mc('No current use',unused)+'</div>'
      +'<p class="msg" style="margin-top:8px">Facts read for '+(f.valid||0)+' of '+(f.total||0)+' apps, drivers and libraries'+(f.failing?' · '+f.failing+' could not be read':'')+(f.large?' · '+f.large+' large, read on request':'')+'</p>'
      +'<div class="actions"><button class="btn btn-p" id="driftBtn" data-action="drift">Check for drift now</button><span class="msg" id="driftMsg">'+(d.drift&&d.drift.finishedAt?'Last drift check '+fmtDate(d.drift.finishedAt):'No drift check yet')+'</span></div>'
      +'<div class="actions"><button class="btn" id="libBtn" data-action="libraries">Refresh libraries</button><span class="msg" id="libMsg">'+h(libTxt)+(lib.error?' (last refresh failed: '+h(lib.error)+')':'')+'</span></div></div></div>';
    html+='<div class="card"><div class="card-h">Components <span class="msg" id="invPkgNote"></span><span class="msg"><label><input type="checkbox" id="onlyRemovable" data-change="invTable"> no current use only (<a href="'+README+'safe-to-remove" target="_blank">rule</a>)</label></span></div><div class="card-b"><div id="invTbl"></div><div id="invLegend"></div></div></div>';
    html+='<div class="card" id="unreadCard"><div class="card-h">Not read yet <span class="msg">their import URL is not known, so their package is not known yet</span></div><div class="card-b"><div id="unreadTbl"></div></div></div>';
    document.getElementById(P).innerHTML=html;window._inv=comps;window._largeBytes=f.largeSourceBytes;rInventoryTable();
  }catch(e){err(P,e,'inventory')}
}
function rInventoryTable(){
  const comps=window._inv||[];const only=document.getElementById('onlyRemovable')?.checked;const now=Date.now();const pk=window._invPkg;
  let sel=pk?comps.filter(c=>c.key===pk.key):comps;
  if(only)sel=sel.filter(c=>removeState(c,comps)==='no-current-use');
  const rows=sel.map(c=>Object.assign({},c,{_cls:classifyComponent(c),_rem:removeState(c,comps),_sev:severity(c.status||'not-checked'),_basis:basisLabel(c,now,window._largeBytes)}));
  const note=document.getElementById('invPkgNote');if(note)note.innerHTML=pk?'package '+h(pk.name)+' · <a href="#" data-action="clearPkg">show all</a>':'';
  const cols=[
    {l:'Name',f:'name',r:r=>clink(r.kind,r.hubId,r.name)+(r.isPrivate?' '+badge('private','var(--muted)'):'')},
    {l:'Kind',f:'kind'},{l:'Namespace',f:'namespace'},{l:'Origin',f:'origin'},
    {l:'Status',f:'status',t:'n',sf:'_sev',r:r=>badge(r._cls.label,r._cls.color)+(r.status==='broken-source'&&r.failCount?' <span class="msg">'+r.failCount+' failed checks</span>':''),ff:r=>r._cls.label},
    {l:'Installed',f:'iver',cmp:(a,b)=>versionSort(a.iver,b.iver),r:r=>h(r.iver||'')+(r.iverSrc&&r.iverSrc!=='field'&&r.iverSrc!=='manifest'?' <span class="msg">('+h(r.iverSrc)+')</span>':'')},
    {l:'Upstream',f:'rver',cmp:(a,b)=>versionSort(a.rver,b.rver)},
    {l:'Facts',f:'_basis',r:r=>'<span class="msg"'+(r.factError?' title="'+h(r.factError)+'"':'')+'>'+h(r._basis)+'</span>'},
    {l:'Used by',f:'usedByCount',t:'n',r:r=>r.kind==='driver'?dlistlink(r.usedByCount,(r.usedBy||[]).map(u=>u.id)):r.kind==='app'?alistlink(r.usedByCount,(r.usedBy||[]).map(u=>u.id)):String(r.usedByCount??0)},
    {l:'Checked',f:'checkedAtMs',t:'n',r:r=>{const a=fmtAgo(r.checkedAtMs,now);return'<span style="color:'+a.color+'" title="'+h(r.checkedAtMs?fmtDate(r.checkedAtMs):'')+(r.error?' · last check failed: '+h(r.error):'')+'">'+a.text+'</span>'}},
    {l:'Source',f:'location',r:r=>dlink2(r.location)},
    {l:'Actions',f:'_act',ff:()=>'',r:r=>rowActions(r)},
  ];
  const main=rows.filter(r=>r.origin!=='unread'),unread=rows.filter(r=>r.origin==='unread');
  tbl('invTbl',cols,main,{sc:4,sd:'asc',filter:true,label:'Filter components',empty:only?'No installed component is without a current use.':pk?'This package has no components on the hub.':'No components on the hub.'});
  document.getElementById('invLegend').innerHTML=main.length?legend(presentStatuses(main)):'';
  const uc=document.getElementById('unreadCard');if(uc)uc.style.display=unread.length?'':'none';
  if(unread.length)tbl('unreadTbl',cols,unread,{sc:0,filter:true,label:'Filter components not read yet',collapse:20,collapseLabel:'Not read yet'});
}
function rowActions(r){
  if(r.hubId==null||!['app','driver','library'].includes(r.kind))return'';
  const id=h(r.kind+'_'+r.hubId);
  let o=r.origin==='local'||r.isPrivate?'':'<button class="btn" data-action="checkOne" data-key="'+h(r.kind+':'+r.hubId)+'">Check</button>';
  if(r._rem==='no-current-use'&&r.kind!=='library')o+=' <button class="btn" data-action="checkRemovable" data-kind="'+h(r.kind)+'" data-id="'+h(r.hubId)+'">Check removable</button>';
  return o+' <span class="msg" id="act_'+id+'"></span>';
}
async function checkOne(key,btn){const m=document.getElementById('act_'+key.replace(':','_'));btn.disabled=true;if(m)m.textContent='Checking…';
  try{const r=await post('drift/check',{key});drop('inventory');if(m)m.textContent=r.error?'Failed: '+r.error:classifyComponent({status:r.status}).label}
  catch(e){if(m)m.textContent='Failed: '+e.message}finally{btn.disabled=false}}
const REMOVE_VERDICT={'no-creator':'no code on the hub creates it','may-be-created':'may be created by','incomplete':'not decided: some code could not be read'};
async function checkRemovable(kind,id,btn){const m=document.getElementById('act_'+kind+'_'+id);btn.disabled=true;
  try{const r=await post('remove-check/start',{kind,id});if(r.error)throw new Error(r.error);
    pollJob(r.jobId,j=>{if(m)m.textContent='Reading '+(j.processed||0)+' / '+(j.total||0)},j=>{btn.disabled=false;const q=j.result||{};
      if(!m)return;if(j.status!=='done'){m.textContent='Check '+j.status+(j.error?': '+j.error:'');return}
      m.textContent=REMOVE_VERDICT[q.verdict]||q.verdict;
      if(q.verdict==='may-be-created')m.textContent+=' '+(q.creators||[]).map(c=>c.name).join(', ');
      if(q.verdict==='incomplete')m.title=(q.unread||[]).map(c=>c.name+': '+c.reason).join('\n')})}
  catch(e){btn.disabled=false;if(m)m.textContent='Failed: '+e.message}}
async function refreshLibraries(){const b=document.getElementById('libBtn');b.disabled=true;
  try{const r=await post('libraries/refresh');if(r.error)throw new Error(r.error);
    pollJob(r.jobId,()=>{document.getElementById('libMsg').textContent='Reading libraries…'},j=>{b.disabled=false;drop('inventory');const q=j.result||{};
      if(j.status==='done'&&!q.error)rInventory();else flash('libMsg','Library refresh '+(q.error?'failed: '+q.error:j.status+(j.error?': '+j.error:'')))})}
  catch(e){b.disabled=false;flash('libMsg','Failed: '+e.message)}}
async function startDrift(){const b=document.getElementById('driftBtn');b.disabled=true;b.textContent='Checking…';
  try{const r=await post('drift/start',{scope:'all'});if(r.error)throw new Error(r.error);pollJob(r.jobId,j=>{document.getElementById('driftMsg').textContent=(j.processed||0)+' / '+(j.total||0)},j=>{drop('inventory');b.disabled=false;b.textContent='Check for drift now';const q=j.result||{};flash('driftMsg',j.status==='done'?'Done: '+(q.checked||0)+' checked, '+(q.failed||0)+' could not be checked, '+(q.skippedLarge||0)+' too large to read':'Drift check '+j.status+(j.error?': '+j.error:''));rInventory()})}
  catch(e){b.disabled=false;b.textContent='Check for drift now';flash('driftMsg','Failed: '+e.message)}}

      +'<div class="metrics">'+mc('App',h(s.appVersion||APP_VERSION))+mc('UI',CODE_VERSION)+mc('Latest on GitHub',latest,v.updateAvailable?'var(--warn)':'')+'</div>'
      +(v.updateAvailable?'<p class="msg">A newer Code Manager is published'+(v.editorPath?': <a href="'+h(v.editorPath)+'" target="_blank">open Apps Code</a> and use Import.':'.')+'</p>':'')+'</div></div>';
    html+='<div class="card"><div class="card-h">Behaviour <span class="msg">fixed values, <a href="'+README+'fixed-values" target="_blank">documented</a></span></div><div class="card-b"><div class="metrics">'+mc('Upstream fetches in flight',s.driftMaxInflight)+mc('Broken after',s.brokenAfter+' failed checks in a row')+'</div></div></div>';
    html+='<div class="card"><div class="card-h">Settings</div><div class="card-b">'+Object.keys(SETTING_LABELS).map(k=>'<label style="display:block;margin:4px 0"><input type="checkbox" id="set_'+k+'"'+(s[k]?' checked':'')+'> '+h(SETTING_LABELS[k])+'</label>').join('')
      +'<div class="actions"><button class="btn btn-p" data-action="saveSettings">Save</button><span class="msg" id="setMsg"></span></div></div></div>';
    html+='<div class="card"><div class="card-h">Export</div><div class="card-b"><div class="actions"><button class="btn" data-action="exportRegistry">Write cm_registry_export.json</button><span class="msg" id="expMsg"></span></div></div></div>';
    document.getElementById(P).innerHTML=html;
  }catch(e){err(P,e,'settings')}
}
async function saveSettings(){const body={};Object.keys(SETTING_LABELS).forEach(k=>body[k]=document.getElementById('set_'+k).checked);try{const r=await post('settings',{data:JSON.stringify(body)});flash('setMsg',r.success?'Saved':'Failed');drop('settings')}catch(e){flash('setMsg','Failed: '+e.message)}}
async function syncUI(){try{const r=await post('ui/sync');if(r.success)location.reload();else flash('setMsg','Sync refused (version mismatch on GitHub?)')}catch(e){flash('setMsg','Failed: '+e.message)}}
async function exportRegistry(){const m=document.getElementById('expMsg');try{const r=await post('export');if(r.error)throw new Error(r.error);m.innerHTML='Written: <a href="/local/cm_registry_export.json" target="_blank">cm_registry_export.json</a>'}catch(e){flash('expMsg','Failed: '+e.message)}}

// ===== Events: one delegated listener per event type (DESIGN.md §10) =====
const ACTIONS={
  retry:el=>{document.getElementById('p-'+el.dataset.tab).innerHTML='';R[el.dataset.tab]()},
  refresh:()=>refreshPage(), drift:()=>startDrift(), libraries:()=>refreshLibraries(),
  checkOne:el=>checkOne(el.dataset.key,el), checkRemovable:el=>checkRemovable(el.dataset.kind,el.dataset.id,el),
  showPkg:el=>showPkg(+el.dataset.i), clearPkg:()=>{window._invPkg=null;rInventoryTable()},
  showHpm:()=>showHpmPackages(), clearOrigin:()=>{window._pkgOrigin=null;rPackages()},
  hpmImport:()=>hpmImport(), saveSettings:()=>saveSettings(), syncUI:()=>syncUI(), exportRegistry:()=>exportRegistry(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!ACTIONS[el.dataset.action])return;if(el.tagName==='A')e.preventDefault();ACTIONS[el.dataset.action](el)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.change==='invTable')rInventoryTable()});

// ===== Router =====
const R={inventory:rInventory,packages:rPackages,hpm:rHpm,settings:rSettings};
function go(t){curTab=t;try{localStorage.setItem('cm_tab',t)}catch(e){}
  document.querySelectorAll('.tab').forEach(e=>{const on=e.dataset.tab===t;e.classList.toggle('active',on);e.setAttribute('aria-selected',on?'true':'false')});
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));
  const p=document.getElementById('p-'+t);if(!p.children.length||p.querySelector('.loading')||p.querySelector('.err'))R[t]();
  if(!document.getElementById('hubInfo').textContent)api('inventory').then(setHeader).catch(()=>{})}
const tabs=document.getElementById('tabs');
tabs.addEventListener('click',e=>{if(e.target.dataset.tab)go(e.target.dataset.tab)});
tabs.addEventListener('keydown',e=>{const t=e.target.dataset&&e.target.dataset.tab;if(!t)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();go(t)}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const all=[...tabs.querySelectorAll('.tab')];const i=all.indexOf(e.target);const n=all[(i+(e.key==='ArrowRight'?1:all.length-1))%all.length];n.focus();go(n.dataset.tab)}});
function refreshPage(){const keys={inventory:['inventory'],packages:['inventory'],hpm:['hpm/status','inventory'],settings:['settings','version/check']};(keys[curTab]||[]).forEach(k=>drop(k));document.getElementById('p-'+curTab).innerHTML='';R[curTab]()}
fitHeader();
if(!R[curTab])curTab='inventory';
go(curTab);
</script>
</body>
