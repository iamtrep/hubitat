# Thermostat Scheduler+ program — Mode 1 behavior spec.
app:
  source: apps/ThermostatSchedulerPlus/ThermostatSchedulerPlusProgram.groovy
  type_name: "Thermostat Scheduler+ Program"
  instance_label: test-tsp
  parent:
    source: apps/ThermostatSchedulerPlus/ThermostatSchedulerPlus.groovy
    type_name: "Thermostat Scheduler+"
    create_mapping: true
  config:
    debugEnable: true
    verifyWrites: true
    whilePaused: "off"
    onResume: "restore"
inputs:
  - { name: test-tsp-th1, driver: Virtual Thermostat, role: thermostats }
  - { name: test-tsp-th2, driver: Virtual Thermostat, role: thermostats }
  - { name: test-tsp-pause, driver: Virtual Switch, role: pauseSwitch }
outputs:
  - { name: test-tsp scheduler, child: true }
maker_api:
  label: test-tsp-maker
cases:
  - name: load-config-and-apply
    setup:
      - { device: test-tsp scheduler, command: resume }
      - { device: test-tsp scheduler, command: setEco, args: ["off"] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [2] }
      - { device: test-tsp-th1, command: heat }
      - { device: test-tsp-th2, command: heat }
      - { device: test-tsp-pause, command: "on" }
      - { mode: Day }
      - settings:
          testConfigJson: '{"v":1,"profiles":[{"name":"Home","heat":21.0,"cool":24.0},{"name":"Out","heat":19.0,"cool":27.0},{"name":"Sleep","heat":18.0,"cool":26.0},{"name":"Away","heat":16.0,"cool":29.0}],"schedules":[{"name":"Normal","type":"time","groups":[{"name":"All","days":[1,2,3,4,5,6,7],"periods":[{"name":"Wake","start":{"kind":"time","at":"06:30"},"profile":"Home"},{"name":"Leave","start":{"kind":"time","at":"08:15"},"profile":"Out"},{"name":"Night","start":{"kind":"time","at":"22:00"},"profile":"Sleep"}]}]},{"name":"Vacation","type":"time","groups":[{"name":"All","days":[1,2,3,4,5,6,7],"periods":[{"name":"Day","start":{"kind":"time","at":"00:00"},"profile":"Away"}]}]}],"active":"Normal","overrides":[{"modeId":4,"profile":"Away"}]}'
      - { button: btnLoadConfig }
      # Saving testClock runs updated() -> initialize() -> evaluate(), which applies
      # the target at the new clock; btnEvaluate then re-evaluates without writing.
      - settings: { testClock: "2026-10-05 09:00" }
    actions:
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp-th2, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp scheduler, attribute: profile, value: Out }
      - { device: test-tsp scheduler, attribute: nextProfile, value: Sleep }
      - { device: test-tsp scheduler, attribute: lastApply, value: ok }

  - name: writes-verified
    actions:
      - { device: test-tsp scheduler, command: applyNow }
    wait_seconds: 18
    assert:
      - { device: test-tsp scheduler, attribute: lastApply, value: ok }

  - name: transition-on-test-clock
    actions:
      - settings: { testClock: "2026-10-05 22:00" }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: profile, value: Sleep }

  - name: hold-profile-next
    actions:
      - { device: test-tsp scheduler, command: holdProfile, args: [Home, next] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 21.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: hold }
      - { device: test-tsp scheduler, attribute: holdEnd, value: next }

  - name: next-hold-ends-at-transition
    actions:
      - settings: { testClock: "2026-10-06 06:30" }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp scheduler, attribute: holdEnd, value: none }

  - name: hold-indefinite-and-resume
    actions:
      - { device: test-tsp scheduler, command: holdProfile, args: [Sleep, indefinite] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: hold }
      - { device: test-tsp scheduler, attribute: holdEnd, value: indefinite }

  - name: resume
    actions:
      - { device: test-tsp scheduler, command: resume }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 21.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: schedule }

  - name: advance
    actions:
      - { device: test-tsp scheduler, command: advance }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: profile, value: Out }

  - name: set-schedule
    actions:
      - { device: test-tsp scheduler, command: resume }
      - { device: test-tsp scheduler, command: setSchedule, args: [Vacation] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: schedule, value: Vacation }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }

  - name: bad-command-logs-warning
    allow_warnings: true
    actions:
      - { device: test-tsp scheduler, command: setSchedule, args: [Nope] }
    wait_seconds: 2
    assert:
      - { device: test-tsp scheduler, attribute: schedule, value: Vacation }
    assert_logs:
      - { pattern: "unknown schedule Nope", level: warn }

  - name: eco-offset-zero
    actions:
      - { device: test-tsp scheduler, command: setEco, args: ["on"] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [0] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: eco, value: "on" }
      - { device: test-tsp scheduler, attribute: heatingTarget, value: 16.0, tolerance: 0.05 }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }

  - name: manual-change-survives-evaluate
    actions:
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [22.5] }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: manual }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 22.5, tolerance: 0.05 }
runtime_budget_seconds: 150
