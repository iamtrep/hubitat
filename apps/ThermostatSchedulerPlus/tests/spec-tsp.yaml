# Thermostat Scheduler+ program — Mode 1 behavior spec.
app:
  source: apps/ThermostatSchedulerPlus/ThermostatSchedulerPlusProgram.groovy
  type_name: "Thermostat Scheduler+ Program"
  instance_label: test-tsp
  parent:
    source: apps/ThermostatSchedulerPlus/ThermostatSchedulerPlus.groovy
    type_name: "Thermostat Scheduler+"
    create_mapping: true
  config:
    debugEnable: true
    verifyWrites: true
    whilePaused: "off"
    onResume: "restore"
inputs:
  - { name: test-tsp-th1, driver: Virtual Thermostat, role: thermostats }
  - { name: test-tsp-th2, driver: Virtual Thermostat, role: thermostats }
  - { name: test-tsp-pause, driver: Virtual Switch, role: pauseSwitch }
outputs:
  - { name: test-tsp scheduler, child: true }
maker_api:
  label: test-tsp-maker
cases:
  - name: load-config-and-apply
    setup:
      - { device: test-tsp scheduler, command: resume }
      - { device: test-tsp scheduler, command: setEco, args: ["off"] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [2] }
      - { device: test-tsp-th1, command: heat }
      - { device: test-tsp-th2, command: heat }
      - { device: test-tsp-pause, command: "on" }
      - { mode: Day }
      - settings:
          testConfigJson: '{"v":1,"profiles":[{"name":"Home","heat":21.0,"cool":24.0},{"name":"Out","heat":19.0,"cool":27.0},{"name":"Sleep","heat":18.0,"cool":26.0},{"name":"Away","heat":16.0,"cool":29.0}],"schedules":[{"name":"Normal","type":"time","groups":[{"name":"All","days":[1,2,3,4,5,6,7],"periods":[{"name":"Wake","start":{"kind":"time","at":"06:30"},"profile":"Home"},{"name":"Leave","start":{"kind":"time","at":"08:15"},"profile":"Out"},{"name":"Night","start":{"kind":"time","at":"22:00"},"profile":"Sleep"}]}]},{"name":"Vacation","type":"time","groups":[{"name":"All","days":[1,2,3,4,5,6,7],"periods":[{"name":"Day","start":{"kind":"time","at":"00:00"},"profile":"Away"}]}]}],"active":"Normal","overrides":[{"modeId":4,"profile":"Away"}]}'
      - { button: btnLoadConfig }
      # Saving testClock runs updated() -> initialize() -> evaluate(), which applies
      # the target at the new clock; btnEvaluate then re-evaluates without writing.
      - settings: { testClock: "2026-10-05 09:00" }
    actions:
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp-th2, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp scheduler, attribute: profile, value: Out }
      - { device: test-tsp scheduler, attribute: nextProfile, value: Sleep }
      - { device: test-tsp scheduler, attribute: lastApply, value: ok }

  - name: writes-verified
    actions:
      - { device: test-tsp scheduler, command: applyNow }
    wait_seconds: 33
    assert:
      - { device: test-tsp scheduler, attribute: lastApply, value: ok }

  - name: transition-on-test-clock
    actions:
      - settings: { testClock: "2026-10-05 22:00" }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: profile, value: Sleep }

  - name: hold-profile-next
    actions:
      - { device: test-tsp scheduler, command: holdProfile, args: [Home, next] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 21.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: hold }
      - { device: test-tsp scheduler, attribute: holdEnd, value: next }

  - name: next-hold-ends-at-transition
    actions:
      - settings: { testClock: "2026-10-06 06:30" }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp scheduler, attribute: holdEnd, value: none }

  - name: hold-indefinite-and-resume
    actions:
      - { device: test-tsp scheduler, command: holdProfile, args: [Sleep, indefinite] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: hold }
      - { device: test-tsp scheduler, attribute: holdEnd, value: indefinite }

  - name: resume
    actions:
      - { device: test-tsp scheduler, command: resume }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 21.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: schedule }

  - name: advance
    actions:
      - { device: test-tsp scheduler, command: advance }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: profile, value: Out }

  - name: set-schedule
    actions:
      - { device: test-tsp scheduler, command: resume }
      - { device: test-tsp scheduler, command: setSchedule, args: [Vacation] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: schedule, value: Vacation }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }

  - name: bad-command-logs-warning
    allow_warnings: true
    actions:
      - { device: test-tsp scheduler, command: setSchedule, args: [Nope] }
    wait_seconds: 2
    assert:
      - { device: test-tsp scheduler, attribute: schedule, value: Vacation }
    assert_logs:
      - { pattern: "unknown schedule Nope", level: warn }

  - name: eco-offset-zero
    actions:
      - { device: test-tsp scheduler, command: setEco, args: ["on"] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [0] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: eco, value: "on" }
      - { device: test-tsp scheduler, attribute: heatingTarget, value: 16.0, tolerance: 0.05 }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }

  - name: manual-change-survives-evaluate
    actions:
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [22.5] }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: manual }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 22.5, tolerance: 0.05 }

  - name: override-in-and-out
    setup:
      # eco-offset-zero leaves eco on with offset 0; later eco cases need offset 2.
      - { device: test-tsp scheduler, command: setEco, args: ["off"] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [2] }
      - { device: test-tsp scheduler, command: setSchedule, args: [Normal] }
      - { device: test-tsp scheduler, command: resume }
      - settings: { testClock: "2026-10-05 09:00" }
      - { button: btnEvaluate }
    actions:
      - { mode: Away }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: mode }

  - name: override-ends-next-hold
    setup:
      - { mode: Day }
      - { device: test-tsp scheduler, command: holdProfile, args: [Home, next] }
    actions:
      - { mode: Away }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: mode }
      - { device: test-tsp scheduler, attribute: holdEnd, value: none }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }

  - name: eco-on-override-and-off-again
    actions:
      - { device: test-tsp scheduler, command: setEco, args: ["on"] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 14.0, tolerance: 0.05 }

  - name: eco-off-while-override-keeps-override
    actions:
      - { device: test-tsp scheduler, command: setEco, args: ["off"] }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 16.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: mode }

  - name: hold-during-override
    actions:
      - { device: test-tsp scheduler, command: holdProfile, args: [Home, next] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: hold }
      - { device: test-tsp scheduler, attribute: holdEnd, value: next }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 21.0, tolerance: 0.05 }

  - name: override-end-ends-next-hold
    actions:
      - { mode: Day }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp scheduler, attribute: holdEnd, value: none }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 19.0, tolerance: 0.05 }

  - name: eco-offset-change-does-not-stack
    setup:
      - { mode: Day }
      - { device: test-tsp scheduler, command: setEco, args: ["on"] }
    actions:
      - { device: test-tsp scheduler, command: setEcoOffset, args: [3] }
      - { device: test-tsp scheduler, command: setEcoOffset, args: [2] }
    command_spacing_seconds: 2
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 17.0, tolerance: 0.05 }

  - name: manual-change-sets-manual
    setup:
      - { device: test-tsp scheduler, command: setEco, args: ["off"] }
    actions:
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [23] }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: manual }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 23.0, tolerance: 0.05 }

  - name: manual-survives-other-events
    setup:
      # Start th2's cooling setpoint away from 27 so the assertion proves the mode-change write.
      - { device: test-tsp-th2, command: setCoolingSetpoint, args: [30] }
    actions:
      - { device: test-tsp-th2, command: cool }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 23.0, tolerance: 0.05 }
      - { device: test-tsp-th2, attribute: coolingSetpoint, value: 27.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: manual }

  - name: next-write-clears-manual
    actions:
      - settings: { testClock: "2026-10-05 22:00" }
      - { button: btnEvaluate }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
      - { device: test-tsp scheduler, attribute: status, value: schedule }

  - name: mode-off-writes-nothing
    setup:
      - { device: test-tsp-th2, command: "off" }
      - { device: test-tsp-th2, command: setHeatingSetpoint, args: [10] }
    actions:
      - { device: test-tsp scheduler, command: applyNow }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th2, attribute: thermostatMode, value: "off" }
      - { device: test-tsp-th2, attribute: heatingSetpoint, value: 10.0, tolerance: 0.05 }

  - name: off-thermostat-heat-gets-setpoint
    actions:
      - { device: test-tsp-th2, command: heat }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th2, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }

  - name: pause-switch-turns-off-and-restores
    actions:
      - { device: test-tsp-pause, command: "off" }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: thermostatMode, value: "off" }
      - { device: test-tsp scheduler, attribute: status, value: restricted }

  - name: resume-restores-mode-and-applies
    actions:
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [12] }
      - { device: test-tsp-pause, command: "on" }
    command_spacing_seconds: 2
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: thermostatMode, value: heat }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }

  - name: resume-leave-off-writes-nothing
    setup:
      - settings: { onResume: leaveOff }
      - { device: test-tsp-pause, command: "off" }
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [12] }
    actions:
      - { device: test-tsp-pause, command: "on" }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: thermostatMode, value: "off" }
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 12.0, tolerance: 0.05 }

  - name: status-switch-pauses
    setup:
      - settings: { onResume: restore }
      - { device: test-tsp-th1, command: heat }
      - { device: test-tsp-th2, command: heat }
      - { button: btnEvaluate }
    actions:
      - { device: test-tsp scheduler, command: "off" }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: switch, value: "off" }
      - { device: test-tsp scheduler, attribute: status, value: paused }
      - { device: test-tsp-th1, attribute: thermostatMode, value: "off" }

  - name: status-switch-resumes
    actions:
      - { device: test-tsp scheduler, command: "on" }
    wait_seconds: 3
    assert:
      - { device: test-tsp scheduler, attribute: status, value: schedule }
      - { device: test-tsp-th1, attribute: thermostatMode, value: heat }

  - name: hub-start-applies
    setup:
      - { device: test-tsp-th1, command: setHeatingSetpoint, args: [12] }
    actions:
      - { button: btnStart }
    wait_seconds: 3
    assert:
      - { device: test-tsp-th1, attribute: heatingSetpoint, value: 18.0, tolerance: 0.05 }
runtime_budget_seconds: 240
